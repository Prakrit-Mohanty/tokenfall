<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TokenFall Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --gold: #d9b46a; --ink: #f3ead6; --panel: rgba(14, 16, 26, .78); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b10; font-family: 'Pixelify Sans', monospace; color: var(--ink); }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  .panel { background: var(--panel); border: 1px solid rgba(217, 180, 106, .55); box-shadow: 0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.04); }

  #loc { position: absolute; top: 18px; left: 18px; padding: 8px 16px 8px 12px; font-family: 'Cinzel', serif; font-size: 15px; letter-spacing: .08em; display: flex; align-items: center; gap: 10px; }
  #loc .gem { width: 9px; height: 9px; background: var(--gold); transform: rotate(45deg); box-shadow: 0 0 8px var(--gold); }
  #loc small { display: block; font-family: 'Pixelify Sans'; font-size: 12px; letter-spacing: .04em; opacity: .7; }

  #party { position: absolute; top: 18px; right: 18px; width: 190px; padding: 10px 12px; font-size: 14px; }
  #party h4 { margin: 0 0 6px; font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: .12em; color: var(--gold); display: flex; justify-content: space-between; }
  #plist > div { display: flex; align-items: center; gap: 7px; line-height: 1.55; }
  #party i { width: 7px; height: 7px; background: #6ee07a; box-shadow: 0 0 6px #6ee07a; }
  #party .me { color: #ffe39a; }

  #chat { position: absolute; left: 18px; bottom: 18px; width: 340px; font-size: 14px; }
  #log { padding: 8px 10px; min-height: 40px; }
  #log p { margin: 2px 0; text-shadow: 0 1px 0 #000; }
  #log b { color: #ffe39a; font-weight: 600; }
  #log .sys { color: #9fd8ff; }
  #chatIn { pointer-events: auto; width: 100%; margin-top: 6px; padding: 7px 10px; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid rgba(217,180,106,.35); outline: none; }
  #chatIn:focus { border-color: var(--gold); }

  #help { position: absolute; bottom: 18px; right: 18px; font-size: 13px; opacity: .8; text-align: right; text-shadow: 0 1px 2px #000; line-height: 1.6; }
  #help kbd { font: inherit; padding: 0 5px; border: 1px solid rgba(243,234,214,.5); margin: 0 2px; }

  #tags { position: absolute; inset: 0; }
  .tag { position: absolute; transform: translate(-50%, -100%); font-size: 13px; white-space: nowrap; text-shadow: 0 1px 0 #000, 0 0 3px #000; }
  .tag.me { color: #ffe39a; }
  .bubble { position: absolute; transform: translate(-50%, -100%); max-width: 220px; padding: 5px 9px; font-size: 13px; color: #2a2116; background: #f6ecd3; border: 2px solid #3a2b1a; white-space: normal; text-align: center; }
  .bubble:after { content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -5px; border: 5px solid transparent; border-top-color: #3a2b1a; border-bottom: 0; }
  #prompt { position: absolute; transform: translate(-50%, -100%); font-size: 14px; padding: 4px 10px; display: none; white-space: nowrap; }
  #prompt kbd { font: inherit; color: #1a140c; background: var(--gold); padding: 0 6px; margin-right: 6px; }

  #dialog { position: absolute; left: 50%; bottom: 28px; width: min(720px, calc(100vw - 32px)); transform: translateX(-50%); padding: 18px 24px 20px; font-size: 19px; line-height: 1.5; display: none; min-height: 108px; }
  #dialog .name { position: absolute; top: -16px; left: 18px; padding: 3px 14px; font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: .08em; background: #1d1a24; border: 1px solid var(--gold); }
  #dialog .next { position: absolute; right: 16px; bottom: 8px; font-size: 13px; color: var(--gold); animation: bob 1s infinite; }
  @keyframes bob { 50% { transform: translateY(3px); } }

  #banner { position: absolute; top: 26%; left: 50%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity .8s; }
  #banner .line { width: 420px; max-width: 80vw; height: 1px; margin: 10px auto; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  #banner .t { font-family: 'Cinzel', serif; font-size: 40px; letter-spacing: .14em; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  #banner .s { font-size: 16px; letter-spacing: .1em; opacity: .85; text-shadow: 0 1px 4px #000; }

  #fade { position: absolute; inset: 0; background: #000; opacity: 1; transition: opacity .45s; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Cinzel', serif; letter-spacing: .2em; font-size: 14px; color: var(--gold); }
  @media (max-width: 720px) { #party, #help { display: none; } #chat { width: calc(100vw - 32px); left: 16px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="tags"></div>
  <div id="prompt" class="panel"></div>
  <div id="loc" class="panel"><div class="gem"></div><div><span id="locName">TokenFall Lobby</span><small id="locSub">Main Plaza</small></div></div>
  <div id="party" class="panel"><h4><span>LOBBY</span><span id="count">5 / 20</span></h4><div id="plist"></div></div>
  <div id="chat"><div id="log" class="panel"></div><input id="chatIn" maxlength="80" placeholder="Press Enter to chat"></div>
  <div id="help"><kbd>WASD</kbd> move &nbsp;<kbd>Shift</kbd> run &nbsp;<kbd>Space</kbd> jump<br><kbd>E</kbd> interact &nbsp;<kbd>Enter</kbd> chat</div>
  <div id="dialog" class="panel"><div class="name"></div><div class="text"></div><div class="next">▼</div></div>
  <div id="banner"><div class="line"></div><div class="t"></div><div class="s"></div><div class="line"></div></div>
  <div id="fade"></div>
  <div id="loading">LOADING</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/sprite.js"></script>
<script src="js/aditya-data.js"></script>
<script src="js/aditya-sheet.js"></script>
<script>
(() => {
  // ================= setup =================
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const PR = Math.min(window.devicePixelRatio || 1, 1.5);
  let resScale = 1, ftAcc = 0, ftN = 0;   // drops render resolution if the machine can't keep up

  const scene = new THREE.Scene();
  const FOG = 0xcdbf9f;
  scene.background = new THREE.Color(FOG);
  scene.fog = new THREE.Fog(FOG, 34, 95);
  const camera = new THREE.PerspectiveCamera(26, 16 / 9, 1, 220);
  const CAM_OFF = new THREE.Vector3(0, 10.5, 24.5);

  let seed = 1337;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const rr = (a, b) => a + rnd() * (b - a);

  // ================= pixel textures =================
  function canvasTex(w, h, draw, opts = {}) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); draw(g, w, h);
    const t = new THREE.CanvasTexture(c);
    t.magFilter = THREE.NearestFilter;
    t.minFilter = opts.nearest ? THREE.NearestFilter : THREE.LinearMipmapLinearFilter;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 8;
    return t;
  }
  const rgb = (c, f = 1) => `rgb(${Math.max(0, Math.min(255, c[0] * f)) | 0},${Math.max(0, Math.min(255, c[1] * f)) | 0},${Math.max(0, Math.min(255, c[2] * f)) | 0})`;
  const P = (g, x, y, c, f) => { g.fillStyle = rgb(c, f); g.fillRect(x, y, 1, 1); };
  function noiseFill(g, w, h, base, amt, chance = 1) {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (rnd() < chance) P(g, x, y, base, 1 + (rnd() - .5) * amt);
  }

  // stones laid in rows; tiles seamlessly
  function stoneTex(base, mortar, rowH = [5, 8], wid = [6, 12], size = 64) {
    return canvasTex(size, size, (g, W, H) => {
      g.fillStyle = rgb(mortar); g.fillRect(0, 0, W, H);
      let y = 0;
      while (y < H) {
        let rh = rowH[0] + (rnd() * (rowH[1] - rowH[0]) | 0); if (H - y < rh + rowH[0]) rh = H - y;
        const off = rnd() * W | 0; let x = 0;
        while (x < W) {
          let sw = wid[0] + (rnd() * (wid[1] - wid[0]) | 0); if (W - x < sw + wid[0]) sw = W - x;
          const v = (rnd() - .5) * 34, c = [base[0] + v + (rnd() - .5) * 12, base[1] + v, base[2] + v - rnd() * 10];
          for (let i = 1; i < sw; i++) for (let j = 1; j < rh; j++) {
            if ((i === 1 || i === sw - 1) && (j === 1 || j === rh - 1)) continue;
            let f = 1;
            if (j === 1 || i === 1) f = 1.16; else if (j === rh - 1 || i === sw - 1) f = .76;
            if (rnd() < .1) f *= .9;
            P(g, (x + i + off) % W, (y + j) % H, c, f);
          }
          x += sw;
        }
        y += rh;
      }
    });
  }
  const TX = {};
  function buildTextures() {
    TX.cobble = stoneTex([168, 156, 132], [78, 70, 60]);
    TX.flag = stoneTex([150, 146, 140], [70, 66, 62], [10, 14], [10, 18]);
    TX.stoneWall = stoneTex([138, 132, 122], [60, 56, 52], [6, 9], [9, 16], 32);
    TX.grass = canvasTex(64, 64, (g, W, H) => {
      noiseFill(g, W, H, [92, 128, 58], .22);
      for (let i = 0; i < 140; i++) { const x = rnd() * W | 0, y = rnd() * H | 0, c = rnd() < .5 ? [122, 160, 70] : [70, 104, 46]; P(g, x, y, c); P(g, x, (y + 1) % H, c, .9); }
    });
    TX.darkGrass = canvasTex(64, 64, (g, W, H) => { noiseFill(g, W, H, [70, 102, 50], .25); });
    TX.dirt = canvasTex(32, 32, (g, W, H) => { noiseFill(g, W, H, [120, 92, 64], .25); });
    TX.plaster = canvasTex(32, 32, (g, W, H) => {
      noiseFill(g, W, H, [222, 214, 196], .07);
      for (let i = 0; i < 6; i++) { let x = rnd() * W | 0, y = rnd() * H | 0; for (let k = 0; k < 4; k++) { P(g, x % W, y % H, [180, 170, 152]); x += rnd() < .5 ? 1 : 0; y++; } }
    });
    TX.wood = canvasTex(32, 32, (g, W, H) => {
      for (let x = 0; x < W; x++) { const plank = (x / 8 | 0), b = [112 + plank % 2 * 10, 74 + plank % 2 * 6, 46]; for (let y = 0; y < H; y++) P(g, x, y, b, x % 8 === 0 ? .62 : 1 + (rnd() - .5) * .1); }
      for (let i = 0; i < 10; i++) { const x = rnd() * W | 0, y = rnd() * H | 0; for (let k = 0; k < 5; k++) P(g, x, (y + k) % H, [80, 52, 32]); }
    });
    TX.darkWood = canvasTex(16, 16, (g, W, H) => { noiseFill(g, W, H, [74, 48, 32], .14); for (let y = 0; y < H; y += 5) for (let x = 0; x < W; x++) if (rnd() < .5) P(g, x, y, [58, 38, 26]); });
    TX.floor = canvasTex(32, 32, (g, W, H) => {
      for (let y = 0; y < H; y++) { const row = y / 8 | 0, b = [150 - row % 2 * 14, 108 - row % 2 * 10, 70]; for (let x = 0; x < W; x++) P(g, x, y, b, y % 8 === 0 || (x + row * 11) % 32 === 0 ? .7 : 1 + (rnd() - .5) * .08); }
    });
    TX.roof = canvasTex(32, 32, (g, W, H) => {
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const col = x % 6, row = y % 8;
        let f = [1.25, 1.1, 1, .9, .7, .5][col];
        if (row === 0) f *= .55; else if (row === 1) f *= 1.15;
        P(g, x, y, [74, 78, 84], f * (1 + (rnd() - .5) * .08));
      }
    });
    TX.lattice = canvasTex(32, 32, (g, W, H) => {
      g.fillStyle = '#2a1d14'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#5a3a24';
      for (let x = 0; x < W; x += 4) g.fillRect(x, 0, 1, H);
      for (let y = 0; y < H; y += 6) g.fillRect(0, y, W, 1);
      g.fillStyle = '#7a5032'; g.fillRect(0, 0, W, 2); g.fillRect(0, H - 2, W, 2); g.fillRect(0, 0, 2, H); g.fillRect(W - 2, 0, 2, H);
    }, { nearest: true });
    TX.door = canvasTex(32, 32, (g, W, H) => {
      noiseFill(g, W, H, [98, 64, 40], .1);
      g.fillStyle = '#3a2416'; g.fillRect(15, 0, 2, H);
      for (const x of [3, 19]) { g.fillStyle = '#4a2e1c'; g.fillRect(x, 3, 10, 26); g.fillStyle = '#6a4630'; for (let yy = 5; yy < 28; yy += 3) g.fillRect(x + 1, yy, 8, 1); }
      g.fillStyle = '#d9b46a'; g.fillRect(13, 16, 2, 2); g.fillRect(17, 16, 2, 2);
    }, { nearest: true });
    TX.cloth = canvasTex(16, 16, (g, W, H) => { for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) P(g, x, y, [150, 52, 40], x % 4 < 2 ? 1 : .86); });
    TX.bark = canvasTex(16, 16, (g, W, H) => { noiseFill(g, W, H, [86, 62, 44], .25); for (let x = 0; x < W; x += 3) for (let y = 0; y < H; y++) if (rnd() < .6) P(g, x, y, [60, 42, 30]); });
    const leaf = (base) => canvasTex(32, 32, (g, W, H) => {
      noiseFill(g, W, H, base, .18);
      for (let i = 0; i < 70; i++) {
        const x = rnd() * W | 0, y = rnd() * H | 0, f = rnd() < .5 ? 1.3 : .62;
        for (let k = 0; k < 5; k++) P(g, (x + [0, 1, -1, 0, 0][k] + W) % W, (y + [0, 0, 0, 1, -1][k] + H) % H, base, f * (k ? .92 : 1));
      }
    });
    TX.leafA = leaf([74, 116, 52]); TX.leafB = leaf([52, 92, 50]); TX.leafC = leaf([96, 132, 56]); TX.blossom = leaf([196, 128, 148]);
    TX.books = canvasTex(32, 32, (g, W, H) => {
      g.fillStyle = '#3b2618'; g.fillRect(0, 0, W, H);
      for (let shelf = 0; shelf < 4; shelf++) {
        let x = 1; const y0 = shelf * 8;
        g.fillStyle = '#6a4630'; g.fillRect(0, y0 + 7, W, 1);
        while (x < W - 1) { const w = 1 + (rnd() * 2 | 0), h = 4 + (rnd() * 3 | 0), c = [[140, 50, 40], [50, 80, 120], [180, 150, 80], [60, 110, 70], [120, 80, 140]][rnd() * 5 | 0]; g.fillStyle = rgb(c); g.fillRect(x, y0 + 7 - h, w, h); g.fillStyle = rgb(c, 1.3); g.fillRect(x, y0 + 7 - h, w, 1); x += w + (rnd() < .15 ? 1 : 0); }
      }
    }, { nearest: true });
    TX.rack = canvasTex(16, 32, (g, W, H) => {
      g.fillStyle = '#1b1d24'; g.fillRect(0, 0, W, H);
      for (let y = 2; y < H; y += 4) { g.fillStyle = '#2c303a'; g.fillRect(1, y, W - 2, 3); g.fillStyle = rnd() < .5 ? '#ffb347' : '#6ee07a'; g.fillRect(2, y + 1, 1, 1); g.fillStyle = '#ffb347'; if (rnd() < .5) g.fillRect(4, y + 1, 1, 1); }
    }, { nearest: true });
    TX.screen = canvasTex(32, 20, (g, W, H) => {
      g.fillStyle = '#0d2a36'; g.fillRect(0, 0, W, H);
      for (let y = 2; y < H - 1; y += 2) { const x0 = 2 + (rnd() * 4 | 0); g.fillStyle = rnd() < .3 ? '#ffd27a' : '#7fe6ff'; g.fillRect(x0, y, 4 + (rnd() * 20 | 0), 1); }
    }, { nearest: true });
    TX.paver = canvasTex(64, 64, (g, W, H) => {
      g.fillStyle = rgb([128, 122, 112]); g.fillRect(0, 0, W, H);
      for (let r = 0; r < 8; r++) for (let c = -1; c < 4; c++) {
        const x0 = c * 16 + (r % 2) * 8, y0 = r * 8, v = (rnd() - .5) * 26, b = [182 + v, 174 + v, 160 + v - rnd() * 8];
        for (let i = 1; i < 16; i++) for (let j = 1; j < 8; j++) { const x = x0 + i; if (x < 0 || x >= W) continue; P(g, x, y0 + j, b, (j === 1 ? 1.05 : j === 7 ? .9 : 1) * (1 + (rnd() - .5) * .05)); }
      }
    });
    TX.concrete = canvasTex(32, 32, (g, W, H) => {
      noiseFill(g, W, H, [196, 192, 184], .06);
      g.fillStyle = rgb([172, 168, 160]); g.fillRect(0, 15, W, 1); g.fillRect(15, 0, 1, H);
      for (const [x, y] of [[7, 7], [23, 7], [7, 23], [23, 23]]) P(g, x, y, [140, 136, 130]);
    });
    TX.cladding = canvasTex(32, 32, (g, W, H) => {
      for (let y = 0; y < H; y++) { const sl = y / 4 | 0, b = [[168, 116, 72], [150, 102, 62], [176, 124, 78]][sl % 3]; for (let x = 0; x < W; x++) P(g, x, y, b, y % 4 === 3 ? .55 : 1 + (rnd() - .5) * .08); }
    });
    TX.roofFlat = canvasTex(32, 32, (g, W, H) => { noiseFill(g, W, H, [124, 122, 118], .1); g.fillStyle = rgb([104, 102, 98]); g.fillRect(0, 0, W, 1); g.fillRect(0, 16, W, 1); });
    // curtain-wall glass: some panes reflect the sky, some show warm lit offices
    const lit = Array.from({ length: 4 }, () => Array.from({ length: 2 }, () => rnd() < .45));
    const glass = (emissive) => canvasTex(32, 32, (g, W, H) => {
      g.fillStyle = emissive ? '#000' : '#363a42'; g.fillRect(0, 0, W, H);
      for (let r = 0; r < 2; r++) for (let c = 0; c < 4; c++) {
        const x0 = c * 8 + 1, y0 = r * 16 + 1, on = lit[c][r];
        for (let j = 0; j < 14; j++) for (let i = 0; i < 7; i++) {
          let col;
          if (on) col = j > 9 ? [120, 92, 66] : [255, 214, 150];
          else { const t = j / 14; col = [150 - t * 60, 176 - t * 66, 196 - t * 66]; if ((i + j) % 9 === 0 || (i + j) % 9 === 1) col = col.map(v => v + 30); }
          if (emissive) col = on && j <= 9 ? [255, 190, 120] : [0, 0, 0];
          P(g, x0 + i, y0 + j, col);
        }
        if (!emissive) { g.fillStyle = '#4a4f58'; g.fillRect(x0, y0 + 10, 7, 1); }
      }
    }, { nearest: true });
    TX.glass = glass(false); TX.glassE = glass(true);
    TX.awning = canvasTex(16, 16, (g, W, H) => { for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) P(g, x, y, x % 8 < 4 ? [46, 120, 112] : [236, 226, 204]); }, { nearest: true });
    TX.coin = canvasTex(64, 64, (g, W, H) => {
      g.fillStyle = '#b8862c'; g.fillRect(0, 0, W, H);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const d = Math.hypot(x - 31.5, y - 31.5); if (d > 26 && d < 29) P(g, x, y, [140, 96, 30]); else if (d <= 26) P(g, x, y, [232, 186, 84], 1 - (x + y) / 400); }
      // the Calfus "C": a heavy black C whose top end finishes in a teal dot
      const dotX = 31.5 + 12.75 * Math.cos(-.6), dotY = 31.5 + 12.75 * Math.sin(-.6);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const dx = x - 31.5, dy = y - 31.5, d = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
        if (d > 8 && d < 17.5 && (a < -1.02 || a > .55)) P(g, x, y, [22, 20, 18]);
        if (Math.hypot(x - dotX, y - dotY) < 5.1) P(g, x, y, [95, 192, 176]);
      }
    }, { nearest: true });
    TX.coin.center.set(.5, .5); TX.coin.rotation = Math.PI / 2;
    TX.grassTuft = canvasTex(16, 16, (g, W, H) => {
      for (let i = 0; i < 9; i++) {
        let x = 2 + rnd() * 12, h = 6 + rnd() * 9; const c = [[96, 140, 60], [120, 160, 70], [76, 112, 48]][i % 3];
        for (let y = 0; y < h; y++) { P(g, x | 0, H - 1 - y, c, 1 + y / h * .25); x += (rnd() - .5) * .8; }
      }
    }, { nearest: true });
    TX.flowers = [[226, 70, 60], [246, 238, 220], [246, 200, 70], [170, 110, 220]].map(pc => canvasTex(16, 16, (g, W, H) => {
      for (let i = 0; i < 4; i++) {
        const x = 2 + i * 4 - (rnd() * 2 | 0), top = 4 + (rnd() * 6 | 0);
        for (let y = top; y < H; y++) P(g, x, y, [80, 120, 50]);
        P(g, x - 1, top, pc); P(g, x + 1, top, pc); P(g, x, top - 1, pc); P(g, x, top + 1, pc, .85); P(g, x, top, [250, 220, 120]);
        P(g, x + 1, top + 5, [96, 140, 60]);
      }
    }, { nearest: true }));
    const blob = document.createElement('canvas'); blob.width = blob.height = 64;
    const bg = blob.getContext('2d'), grd = bg.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, 'rgba(0,0,0,.55)'); grd.addColorStop(1, 'rgba(0,0,0,0)'); bg.fillStyle = grd; bg.fillRect(0, 0, 64, 64);
    TX.blob = new THREE.CanvasTexture(blob);
  }

  function textTex(text, opts = {}) {
    const w = opts.w || 256, h = opts.h || 48;
    return canvasTex(w, h, (g) => {

  // ================= ABZ office (Calfus), from its floor plan =================
  // Plan coordinates in metres: x 0 → 20 west to east, y -1.46 → 16.8 north to south, the lobby sticks out west (x -4 → 0).
  // Scaled up by S like the HQ office so there's room to walk; furniture stays real size.
  // Everything is laid out in plan orientation, then turned a quarter so the lobby is at the south and you walk in facing north.
  function buildABZ(a) {
    const S = 1.4, { cx, cz } = a, X = x => cx + (x - 10) * S, Z = y => cz + (y - 7.7) * S, L = v => v * S;
    const n0 = scene.children.length, c0 = COL.length, w0 = WALK.length, i0 = INTER.length, b0 = BEADS.length, fades = [];

    const floor = (x0, y0, x1, y1, m, y, s) => { const [x, z, w, d] = span(x0, y0, x1, y1); plane(w, d, m, x, y, z, s); };

  // ================= static batching =================
  // Thousands of boxes become a few dozen draw calls: bake every static, single-material mesh into one geometry
  // per (material, shadow-casting, zone). Zones are kept apart so the far-away areas still get frustum-culled.
  function mergeStatic() {
    scene.updateMatrixWorld(true);
    const buckets = new Map(), dead = [], wp = new THREE.Vector3();
    const dyn = o => { for (let p = o; p; p = p.parent) if (p.userData.dyn) return true; return false; };
    const ok = m => m.isMeshStandardMaterial && !m.transparent;
    scene.traverse(o => {
      if (!o.isMesh || o.isInstancedMesh || dyn(o)) return;
      const multi = Array.isArray(o.material);
      if (multi ? !o.material.every(ok) : !ok(o.material)) return;
      const g = o.geometry; if (!g.attributes.uv || !g.attributes.normal) return;
      o.getWorldPosition(wp);
      const zone = wp.x < -150 ? 'w' : wp.x > 150 ? 'e' : wp.z < -150 ? 'n' : wp.z > 150 ? 's' : 'l';
      const flat = g.index ? g.toNonIndexed() : g.clone(); flat.applyMatrix4(o.matrixWorld);
      // a multi-material mesh is split into one piece per material group (groups index the flattened vertices 1:1)
      const parts = multi ? g.groups.map(gr => [o.material[gr.materialIndex], gr.start, gr.count]) : [[o.material, 0, flat.attributes.position.count]];
      for (const [mat, start, count] of parts) {
        const key = mat.uuid + (o.castShadow ? 1 : 0) + zone;
        if (!buckets.has(key)) buckets.set(key, { mat, cast: o.castShadow, list: [] });
        buckets.get(key).list.push({ g: flat, start, count });
      }
      dead.push(o);
    });
    for (const o of dead) o.parent.remove(o);
    for (const { mat, cast, list } of buckets.values()) {
      let n = 0; for (const p of list) n += p.count;
      const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = new Float32Array(n * 2);
      let k = 0;
      for (const { g, start, count } of list) {
        const A = g.attributes;
        pos.set(A.position.array.subarray(start * 3, (start + count) * 3), k * 3); nor.set(A.normal.array.subarray(start * 3, (start + count) * 3), k * 3);
        uv.set(A.uv.array.subarray(start * 2, (start + count) * 2), k * 2); k += count;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
      geo.computeBoundingSphere();
      const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = true; scene.add(m);
    }
  }

    const bulbs = [], segs = [[0, 1], [1, 2], [2, 3], [3, 0], [0, 2]];

  };
  let npcs = [];
  const CHATTER_OFFICE = ['who booked the Prompt Lab again?', 'chai break in 5?', 'the carrom queen is MINE', 'standup in the Token Room', 'love the marigolds', 'anyone seen my charger?'];
  const NPC_BOUNDS = { lobby: [-16, -10.5, 16, 17.5], lab: [-9.6, -317.5, 9.6, -282.3], abz: [-12.2, 286.7, 12, 313.3] };
  const OFFICE_NPCS = ['rahul.k', 'meera_s', 'devansh'];
  Object.assign(NPC_TALK, {
    'rahul.k': ['Welcome to the office!', 'Fair warning: the Prompt Lab meeting room is always booked.'],
    'meera_s': ['The chai machine is by the lounge. Probably.', 'Ask me about tokens. Actually, ask the Token Room.'],
    'devansh': ['I\'m on carrom duty today.', 'Did you see the chandeliers? Nobody knows who picked them, but we love them.'],
  });
  function randomSpot() {
    for (let i = 0; i < 200; i++) { const x = rr(-15, 15), z = rr(-9, 16); if (!blocked(x, z, .6)) return { x, z }; }
    return { x: 0, z: 2 };
  }
  // NPCs move diagonally first, then straight; check that whole route for obstacles
  function routeClear(x0, z0, x1, z1) {
    const dx = x1 - x0, dz = z1 - z0, d = Math.min(Math.abs(dx), Math.abs(dz));
    const mx = x0 + Math.sign(dx) * d, mz = z0 + Math.sign(dz) * d;
    for (const [ax, az, bx, bz] of [[x0, z0, mx, mz], [mx, mz, x1, z1]]) {
      const n = Math.ceil(Math.hypot(bx - ax, bz - az) / .25);
      for (let i = 1; i <= n; i++) if (blocked(ax + (bx - ax) * i / n, az + (bz - az) * i / n, .5)) return false;
    }
    return true;
  }
  function pickTarget(c) {
    for (let i = 0; i < 60; i++) {
      const far = i < 40, a = Math.random() * 6.283, r = far ? 3 + Math.random() * 10 : .8 + Math.random() * 2;
      const x = c.x + Math.cos(a) * r, z = c.y + Math.sin(a) * r;
      const b = NPC_BOUNDS[c.zone];
      if (x > b[0] && x < b[2] && z > b[1] && z < b[3] && routeClear(c.x, c.y, x, z)) return { x, z };
    }
    return null;
  }
  function npcThink(c, dt) {
    if (c.wait > 0) { c.wait -= dt; c.setInput({ up: false, down: false, left: false, right: false }); return; }
    if (!c.target) { c.target = pickTarget(c); if (!c.target) { c.wait = 500; return; } }
    const dx = c.target.x - c.x, dz = c.target.z - c.y;
    if (Math.hypot(dx, dz) < .35 || c.stuck > 350) { const stuck = c.stuck > 350; c.target = null; c.stuck = 0; c.wait = stuck ? 200 : 1500 + Math.random() * 5000; return; }
    c.setInput({ left: dx < -.2, right: dx > .2, up: dz < -.2, down: dz > .2 });
  }
  function say(c, text, ms = 4200) {
    if (!c.bubble) { c.bubble = document.createElement('div'); c.bubble.className = 'bubble'; tagsEl.appendChild(c.bubble); }
    c.bubble.textContent = text; c.bubble.style.display = 'block'; c.bubbleT = ms;
    log(c.name, text);
  }

  // ================= UI =================
  const logEl = document.getElementById('log'), lines = [];
  function log(name, text, sys) {
    lines.push({ name, text, sys }); if (lines.length > 5) lines.shift();
    logEl.innerHTML = lines.map(l => l.sys ? `<p class="sys">${esc(l.text)}</p>` : `<p><b>${esc(l.name)}:</b> ${esc(l.text)}</p>`).join('');
  }
  const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const dlg = document.getElementById('dialog'), dlgName = dlg.querySelector('.name'), dlgText = dlg.querySelector('.text');
  let dialog = null;
  function talk(name, lines) { dialog = { name, lines, i: 0, ch: 0 }; dlgName.textContent = name; dlg.style.display = 'block'; }
  function advanceDialog() {
    const l = dialog.lines[dialog.i];
    if (dialog.ch < l.length) { dialog.ch = l.length; return; }
    dialog.i++; dialog.ch = 0;
    if (dialog.i >= dialog.lines.length) { dialog = null; dlg.style.display = 'none'; }
  }
  const banner = document.getElementById('banner');
  let bannerT = 0;
  function showBanner(t, s) { banner.querySelector('.t').textContent = t; banner.querySelector('.s').textContent = s; banner.style.opacity = 1; bannerT = 2600; }
  const promptEl = document.getElementById('prompt');
  const fadeEl = document.getElementById('fade');

  // ================= input =================
  const keys = {};
  const chatIn = document.getElementById('chatIn');
  addEventListener('keydown', e => {
    if (document.activeElement === chatIn) {
      if (e.key === 'Enter') { const v = chatIn.value.trim(); if (v) say(hero, v); chatIn.value = ''; chatIn.blur(); }
      if (e.key === 'Escape') chatIn.blur();
      return;
    }
    if (e.key === 'Enter') { chatIn.focus(); e.preventDefault(); return; }
    if (dialog) { if (['Space', 'KeyE', 'Enter', 'Escape'].includes(e.code) && !e.repeat) advanceDialog(); e.preventDefault(); return; }
    keys[e.code] = true;
    if (e.code === 'Space' && !e.repeat) { hero.trigger('jump'); e.preventDefault(); }
    if (e.code === 'KeyE' && !e.repeat && nearest) nearest.act();
  });
  addEventListener('keyup', e => { keys[e.code] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  // ================= post-processing: tilt-shift depth of field + bloom =================
  const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), fsGeo = new THREE.PlaneGeometry(2, 2);
  const VS = 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }';
  function fsPass(fragmentShader, uniforms) {
    const mat = new THREE.ShaderMaterial({ vertexShader: VS, fragmentShader, uniforms, depthTest: false, depthWrite: false });
    const s = new THREE.Scene(); s.add(new THREE.Mesh(fsGeo, mat));
    return { u: uniforms, run(target) { renderer.setRenderTarget(target); renderer.render(s, fsCam); } };
  }
  const rtOpts = { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter };
  const rtScene = new THREE.WebGLRenderTarget(4, 4, rtOpts);
  rtScene.depthTexture = new THREE.DepthTexture(4, 4, THREE.UnsignedIntType);   // 16-bit depth z-fights the floor at a distance
  const rtA = new THREE.WebGLRenderTarget(4, 4, rtOpts), rtB = new THREE.WebGLRenderTarget(4, 4, rtOpts);
  const bright = fsPass(`uniform sampler2D t; uniform vec2 px; varying vec2 vUv;
    void main(){ vec3 c=vec3(0.); for(int i=0;i<4;i++){ vec2 o=vec2(float(i-(i/2)*2)-.5,float(i/2)-.5)*px*1.5; c+=texture2D(t,vUv+o).rgb; } c*=.25;
      float l=max(c.r,max(c.g,c.b)); gl_FragColor=vec4(c*smoothstep(1.,1.8,l),1.); }`, { t: { value: rtScene.texture }, px: { value: new THREE.Vector2() } });
  const blur = fsPass(`uniform sampler2D t; uniform vec2 dir; varying vec2 vUv;
    void main(){ vec3 c=texture2D(t,vUv).rgb*.227; c+=(texture2D(t,vUv+dir*1.38).rgb+texture2D(t,vUv-dir*1.38).rgb)*.316; c+=(texture2D(t,vUv+dir*3.23).rgb+texture2D(t,vUv-dir*3.23).rgb)*.07; gl_FragColor=vec4(c,1.); }`,
    { t: { value: null }, dir: { value: new THREE.Vector2() } });
  const final = fsPass(`uniform sampler2D tColor, tDepth, tBloom; uniform vec2 res; uniform float focus, nearP, farP, maxR, time;
    varying vec2 vUv;
    float lin(float d){ float z=d*2.-1.; return 2.*nearP*farP/(farP+nearP-z*(farP-nearP)); }
    float coc(float z, vec2 uv){ float d=z-focus; float c=clamp((abs(d)-(d<0.?1.5:3.))/(d<0.?5.:14.),0.,1.); c=max(c,smoothstep(.2,0.,uv.y)*.8+smoothstep(.82,1.,uv.y)*.6); return min(c,1.)*maxR; }
    void main(){
      float zc=lin(texture2D(tDepth,vUv).x), cc=coc(zc,vUv);
      vec3 acc=texture2D(tColor,vUv).rgb; float ws=1.;
      for(int i=1;i<36;i++){
        float r=sqrt(float(i)/36.), a=float(i)*2.39996;
        vec2 uv=vUv+vec2(cos(a),sin(a))*r*maxR/res;
        float zs=lin(texture2D(tDepth,uv).x), cs=coc(zs,uv);
        float ce=zs<zc?cs:min(cs,cc);
        float w=clamp(ce-r*maxR+1.,0.,1.);
        acc+=texture2D(tColor,uv).rgb*w; ws+=w;
      }
      vec3 c=acc/ws + texture2D(tBloom,vUv).rgb*.6;
      c=c/(1.+max(c-1.,0.)*.6);                       // soft clip highlights
      c=mix(vec3(dot(c,vec3(.299,.587,.114))),c,1.06)*vec3(1.04,1.,.92);
      float L=dot(c,vec3(.299,.587,.114));
      c=mix(c,c*vec3(.84,.94,1.12),(1.-smoothstep(0.,.45,L))*.55);   // cool shadows
      c=mix(c,c*vec3(1.07,1.,.88),smoothstep(.5,1.,L)*.45);          // warm highlights
      c=pow(c,vec3(1.06));
      vec2 v=vUv-.5; c*=1.-dot(v,v)*.85;              // vignette
      c+= (fract(sin(dot(gl_FragCoord.xy+time,vec2(12.98,78.23)))*43758.5)-.5)*.018;
      gl_FragColor=vec4(c,1.);
    }`, {
    tColor: { value: rtScene.texture }, tDepth: { value: rtScene.depthTexture }, tBloom: { value: rtA.texture },
    res: { value: new THREE.Vector2() }, focus: { value: 19 }, nearP: { value: camera.near }, farP: { value: camera.far }, maxR: { value: 8 }, time: { value: 0 },
  });
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setPixelRatio(PR * resScale); renderer.setSize(w, h, false);
    const W = Math.round(w * PR * resScale), H = Math.round(h * PR * resScale);
    rtScene.setSize(W, H); rtA.setSize(W >> 2, H >> 2); rtB.setSize(W >> 2, H >> 2);
    final.u.res.value.set(W, H); final.u.maxR.value = Math.max(4, H / 105);
    bright.u.px.value.set(1 / W, 1 / H);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  function render() {
    renderer.setRenderTarget(rtScene); renderer.render(scene, camera);
    bright.run(rtA);
    for (let i = 0; i < 2; i++) {
      blur.u.t.value = rtA.texture; blur.u.dir.value.set(1 / rtA.width, 0); blur.run(rtB);
      blur.u.t.value = rtB.texture; blur.u.dir.value.set(0, 1 / rtA.height); blur.run(rtA);
    }
    final.run(null);
  }

  // ================= zones & travel =================
  let zone = 'lobby', traveling = false, armed = true;
  const locName = document.getElementById('locName'), locSub = document.getElementById('locSub');
  function setZone(z) {
    zone = z;
    for (const k in ZONE_LIGHTS) for (const l of ZONE_LIGHTS[k]) l.intensity = k === z ? l.userData.base : 0;
    const indoor = z === 'lab' || z === 'abz';
    scene.fog.near = z === 'abz' ? 50 : 34; scene.fog.far = z === 'abz' ? 190 : 95;   // up on the 15th floor you can see the city below
    sun.intensity = indoor ? .5 : 1.3; hemi.intensity = indoor ? .5 : .58;
    hemi.color.set(indoor ? 0xe8e4dc : 0xcfdcff);
    const a = AREAS[z];
    locName.textContent = a ? a.name : 'TokenFall Lobby'; locSub.textContent = a ? a.sub : 'Main Plaza';
    const here = ['aditya', ...npcs.filter(c => c.zone === z).map(c => c.name)];
    document.querySelector('#party h4 span').textContent = a ? a.name.toUpperCase() : 'LOBBY';
    document.getElementById('count').textContent = `${here.length} / 20`;
    document.getElementById('plist').innerHTML = here.map((n, i) => `<div class="${i ? '' : 'me'}"><i></i>${esc(n)}${i ? '' : ' (you)'}</div>`).join('');
  }
  function travel(p) {
    traveling = true; fadeEl.style.opacity = 1;
    setTimeout(() => {
      const to = p.to;
      if (p.at) { hero.x = p.at[0]; hero.y = p.at[1]; hero.dir = 'down'; }
      else if (to === 'lobby') { const r = AREAS[p.zone].ret; hero.x = r[0]; hero.y = r[1]; hero.dir = p.zone === 'lab' ? 'down' : p.zone === 'archive' ? 'right' : 'left'; }
      else { const a = AREAS[to], sp = a.spawn || [0, 4.6]; hero.x = a.cx + sp[0]; hero.y = a.cz + sp[1]; hero.dir = 'up'; }
      setZone(to); hero.zone = to; armed = false;
      snapCamera();
      const a = AREAS[to];
      showBanner(a ? a.name : 'TokenFall Lobby', a ? a.sub : 'Main Plaza');
      log('', `You travelled to ${a ? a.name : 'the Lobby'}.`, true);
      fadeEl.style.opacity = 0; traveling = false;
    }, 480);
  }

  // ================= camera =================
  const camTarget = new THREE.Vector3(), tmp = new THREE.Vector3();
  function snapCamera() { camTarget.set(hero.x, .9, hero.y); camera.position.copy(camTarget).add(CAM_OFF); camera.lookAt(camTarget); }

  // ================= main loop =================
  let hero, nearest = null, nearP = null, last = performance.now(), T = 0, chatterT = 4000;
  function frame(now) {
    const raw = now - last, dt = Math.min(50, raw); last = now;
    if (!document.hidden) { ftAcc += raw; ftN++; }
    if (ftAcc > 2500) {
      const avg = ftAcc / ftN; ftAcc = ftN = 0;
      if (avg > 24 && resScale > .55) { resScale -= .15; resize(); } else if (avg < 12 && resScale < 1) { resScale = Math.min(1, resScale + .15); resize(); }
    } T += dt / 1000; timeU.value = T; final.u.time.value = T % 100;
    // hero
    const typing = document.activeElement === chatIn;
    hero.setInput(dialog || traveling || typing ? { up: false, down: false, left: false, right: false, run: false } : {
      up: keys.KeyW || keys.ArrowUp, down: keys.KeyS || keys.ArrowDown, left: keys.KeyA || keys.ArrowLeft, right: keys.KeyD || keys.ArrowRight, run: keys.ShiftLeft || keys.ShiftRight,
    });
    stepChar(hero, dt);
    // NPCs
    for (const c of npcs) {
      npcThink(c, dt);
      const ox = c.x, oz = c.y; stepChar(c, dt);
      if (c.moving && Math.hypot(c.x - ox, c.y - oz) < c.speed * dt / 1000 * .4) c.stuck += dt; else c.stuck = 0;
    }
    chatterT -= dt;
    if (chatterT < 0) { chatterT = 6000 + Math.random() * 7000; const here = npcs.filter(c => c.zone === zone); if (here.length) { const pool = zone === 'lab' || zone === 'abz' ? CHATTER_OFFICE : CHATTER; say(here[Math.random() * here.length | 0], pool[Math.random() * pool.length | 0]); } }
    for (const c of chars) syncChar(c);
    // portals
    let nearPortal = false, bestP = 3.4; nearP = null;
    for (const p of PORTALS) {
      const d = Math.hypot(hero.x - p.x, hero.y - p.z);
      if (d < 2.4) nearPortal = true;
      if (p.zone === zone && d < bestP) { bestP = d; nearP = p; }
      if (armed && !traveling && d < 1.1) travel(p);
    }
    if (!nearPortal) armed = true;
    // nearest interactable (NPCs too)
    nearest = null; let best = 99;
    for (const it of INTER) { const d = Math.hypot(hero.x - it.x, hero.y - it.z); if (d < it.r && d < best) { best = d; nearest = it; } }
    for (const c of npcs) {
      if (c.zone !== zone) continue;
      const d = Math.hypot(hero.x - c.x, hero.y - c.y);
      if (d < 1.5 && d < best) { best = d; nearest = { x: c.x, z: c.y, label: c.name, verb: 'Talk', act: () => { c.wait = 4000; c.setInput({}); c.dir = Math.abs(hero.x - c.x) > Math.abs(hero.y - c.y) ? (hero.x > c.x ? 'right' : 'left') : (hero.y > c.y ? 'down' : 'up'); talk(c.name, NPC_TALK[c.name]); } }; }
    }
    // camera follows with a little lag
    camTarget.lerp(tmp.set(hero.x, .9, hero.y), 1 - Math.pow(.004, dt / 1000));
    camera.position.copy(camTarget).add(CAM_OFF); camera.lookAt(camTarget);
    sun.position.copy(camTarget).add(SUN_DIR); sun.target.position.copy(camTarget);
    final.u.focus.value = tmp.copy(camTarget).sub(camera.position).dot(camera.getWorldDirection(new THREE.Vector3()));
    // dust drifts around the camera
    const dp = dust.geometry.attributes.position;
    for (let i = 0; i < dp.count; i++) {
      let x = dp.getX(i) + Math.sin(T * .5 + i) * .004, y = dp.getY(i) + .003, z = dp.getZ(i);
      if (y > 6) y = .3;
      x = camTarget.x + ((x - camTarget.x + 20) % 40 + 40) % 40 - 20; z = camTarget.z + ((z - camTarget.z + 16) % 32 + 32) % 32 - 16;
      dp.setXYZ(i, x, y, z);
    }
    dp.needsUpdate = true;
    for (const f of anim) f(T);
    for (const f of life) f(T, dt / 1000);
    for (const f of FADERS) {
      const hide = f.test();
      if (hide !== f.faded) { f.faded = hide; for (const m of f.meshes) m.material = hide ? m.userData.fade : m.userData.mat; }
    }
    render();
    drawUI(dt);
    requestAnimationFrame(frame);
  }

  const proj = new THREE.Vector3();
  function toScreen(x, y, z) { proj.set(x, y, z).project(camera); return [(proj.x + 1) / 2 * innerWidth, (1 - proj.y) / 2 * innerHeight, proj.z < 1]; }
  function drawUI(dt) {
    for (const c of chars) {
      const show = c.zone === zone;
      const [sx, sy, vis] = toScreen(c.x, 1.78 + c.mesh.position.y, c.y);
      c.tag.style.display = show && vis && !dialog ? 'block' : 'none';
      c.tag.style.left = sx + 'px'; c.tag.style.top = sy + 'px';
      if (c.bubble) {
        c.bubbleT -= dt;
        c.bubble.style.display = show && vis && c.bubbleT > 0 && !dialog ? 'block' : 'none';
        c.bubble.style.left = sx + 'px'; c.bubble.style.top = (sy - 22) + 'px';
      }
    }
    if (nearest && !dialog && !traveling) {
      const [sx, sy] = toScreen(nearest.x, 2.4, nearest.z);
      promptEl.innerHTML = `<kbd>E</kbd>${esc(nearest.verb)} · ${esc(nearest.label)}`;
      promptEl.style.display = 'block'; promptEl.style.left = sx + 'px'; promptEl.style.top = sy + 'px';
    } else if (nearP && !dialog && !traveling) {   // portals say where they go when you walk up to them
      const [sx, sy] = toScreen(nearP.x, 2.1, nearP.z);
      promptEl.innerHTML = `Step in · ${esc(nearP.label)}`;
      promptEl.style.display = 'block'; promptEl.style.left = sx + 'px'; promptEl.style.top = sy + 'px';
    } else promptEl.style.display = 'none';
    if (dialog) {
      const l = dialog.lines[dialog.i];
      if (dialog.ch < l.length) dialog.ch = Math.min(l.length, dialog.ch + dt * .05);
      dlgText.textContent = l.slice(0, dialog.ch | 0);
    }
    if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) banner.style.opacity = 0; }
  }

  // ================= boot =================
  const fontsReady = document.fonts ? Promise.race([Promise.all([document.fonts.load('600 24px "Pixelify Sans"'), document.fonts.load('700 20px Cinzel')]), new Promise(r => setTimeout(r, 2000))]) : Promise.resolve();
  const sheetImg = new Image();
  const sheetReady = new Promise(r => { sheetImg.onload = r; sheetImg.src = window.ADITYA_SHEET; });
  Promise.all([fontsReady, sheetReady]).then(() => {
    buildTextures(); buildMaterials();
    sheetTex = new THREE.Texture(sheetImg); sheetTex.magFilter = sheetTex.minFilter = THREE.NearestFilter; sheetTex.generateMipmaps = false; sheetTex.needsUpdate = true;
    buildLobby(); buildAreas(); mergeStatic(); buildDust(); buildLife();
    hero = makeChar('aditya', 0, 2.6, { me: true });
    hero.dir = 'down'; hero.zone = 'lobby';
    npcs = NPC_NAMES.map(n => { const s = randomSpot(), c = makeChar(n, s.x, s.z, { speed: 2.2 }); c.wait = Math.random() * 3000; return c; });
    for (const [n, x, z] of [['rahul.k', -4, -8.4], ['meera_s', 3.4, -9], ['devansh', -4, 5.6]]) { const c = makeChar(n, x, -300 + z, { speed: 2.1, zone: 'lab' }); c.wait = Math.random() * 3000; npcs.push(c); }
    for (const [n, x, z] of [['sana.k', 7.4, 298.6], ['arjun_p', -.3, 291.6]]) { const c = makeChar(n, x, z, { speed: 2.1, zone: 'abz' }); c.wait = Math.random() * 3000; npcs.push(c); }
    const q = new URLSearchParams(location.search);
    if (q.get('zone') && AREAS[q.get('zone')]) { const a = AREAS[q.get('zone')], sp = a.spawn || [0, 4.6]; hero.x = a.cx + sp[0]; hero.y = a.cz + sp[1]; hero.zone = q.get('zone'); }
    if (q.get('at')) { const [ax, az] = q.get('at').split(',').map(Number); hero.x = ax; hero.y = az; }
    setZone(hero.zone); resize(); snapCamera();
    document.getElementById('loading').remove();
    fadeEl.style.opacity = 0;
    showBanner('TokenFall', 'Main Plaza');
    log('', 'Welcome to TokenFall! Walk through a glowing gate to visit an area.', true);
    setTimeout(() => say(npcs[0], 'hi aditya! 👋'), 1800);
    requestAnimationFrame(t => { last = t; frame(t); });
  });
})();
</script>
</body>
