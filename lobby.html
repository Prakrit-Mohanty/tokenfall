<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TokenFall Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --gold: #d9b46a; --ink: #f3ead6; --panel: rgba(14, 16, 26, .78); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b10; font-family: 'Pixelify Sans', monospace; color: var(--ink); }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  .panel { background: var(--panel); border: 1px solid rgba(217, 180, 106, .55); box-shadow: 0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.04); }

  #loc { position: absolute; top: 18px; left: 18px; padding: 8px 16px 8px 12px; font-family: 'Cinzel', serif; font-size: 15px; letter-spacing: .08em; display: flex; align-items: center; gap: 10px; }
  #loc .gem { width: 9px; height: 9px; background: var(--gold); transform: rotate(45deg); box-shadow: 0 0 8px var(--gold); }
  #loc small { display: block; font-family: 'Pixelify Sans'; font-size: 12px; letter-spacing: .04em; opacity: .7; }

  #party { position: absolute; top: 18px; right: 18px; width: 190px; padding: 10px 12px; font-size: 14px; }
  #party h4 { margin: 0 0 6px; font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: .12em; color: var(--gold); display: flex; justify-content: space-between; }
  #plist > div { display: flex; align-items: center; gap: 7px; line-height: 1.55; }
  #party i { width: 7px; height: 7px; background: #6ee07a; box-shadow: 0 0 6px #6ee07a; }
  #party .me { color: #ffe39a; }

  #chat { position: absolute; left: 18px; bottom: 18px; width: 340px; font-size: 14px; }
  #log { padding: 8px 10px; min-height: 40px; }
  #log p { margin: 2px 0; text-shadow: 0 1px 0 #000; }
  #log b { color: #ffe39a; font-weight: 600; }
  #log .sys { color: #9fd8ff; }
  #chatIn { pointer-events: auto; width: 100%; margin-top: 6px; padding: 7px 10px; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid rgba(217,180,106,.35); outline: none; }
  #chatIn:focus { border-color: var(--gold); }

  #help { position: absolute; bottom: 18px; right: 18px; font-size: 13px; opacity: .8; text-align: right; text-shadow: 0 1px 2px #000; line-height: 1.6; }
  #help kbd { font: inherit; padding: 0 5px; border: 1px solid rgba(243,234,214,.5); margin: 0 2px; }

  #tags { position: absolute; inset: 0; }
  .tag { position: absolute; transform: translate(-50%, -100%); font-size: 13px; white-space: nowrap; text-shadow: 0 1px 0 #000, 0 0 3px #000; }
  .tag.me { color: #ffe39a; }
  .bubble { position: absolute; transform: translate(-50%, -100%); max-width: 220px; padding: 5px 9px; font-size: 13px; color: #2a2116; background: #f6ecd3; border: 2px solid #3a2b1a; white-space: normal; text-align: center; }
  .bubble:after { content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -5px; border: 5px solid transparent; border-top-color: #3a2b1a; border-bottom: 0; }
  #prompt { position: absolute; transform: translate(-50%, -100%); font-size: 14px; padding: 4px 10px; display: none; white-space: nowrap; }
  #prompt kbd { font: inherit; color: #1a140c; background: var(--gold); padding: 0 6px; margin-right: 6px; }

  #dialog { position: absolute; left: 50%; bottom: 28px; width: min(720px, calc(100vw - 32px)); transform: translateX(-50%); padding: 18px 24px 20px; font-size: 19px; line-height: 1.5; display: none; min-height: 108px; }
  #dialog .name { position: absolute; top: -16px; left: 18px; padding: 3px 14px; font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: .08em; background: #1d1a24; border: 1px solid var(--gold); }
  #dialog .next { position: absolute; right: 16px; bottom: 8px; font-size: 13px; color: var(--gold); animation: bob 1s infinite; }
  @keyframes bob { 50% { transform: translateY(3px); } }

  #banner { position: absolute; top: 26%; left: 50%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity .8s; }
  #banner .line { width: 420px; max-width: 80vw; height: 1px; margin: 10px auto; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  #banner .t { font-family: 'Cinzel', serif; font-size: 40px; letter-spacing: .14em; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  #banner .s { font-size: 16px; letter-spacing: .1em; opacity: .85; text-shadow: 0 1px 4px #000; }

  #fade { position: absolute; inset: 0; background: #000; opacity: 1; transition: opacity .45s; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Cinzel', serif; letter-spacing: .2em; font-size: 14px; color: var(--gold); }
  @media (max-width: 720px) { #party, #help { display: none; } #chat { width: calc(100vw - 32px); left: 16px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="tags"></div>
  <div id="prompt" class="panel"></div>
  <div id="loc" class="panel"><div class="gem"></div><div><span id="locName">TokenFall Lobby</span><small id="locSub">Main Plaza</small></div></div>
  <div id="party" class="panel"><h4><span>LOBBY</span><span id="count">5 / 20</span></h4><div id="plist"></div></div>
  <div id="chat"><div id="log" class="panel"></div><input id="chatIn" maxlength="80" placeholder="Press Enter to chat"></div>
  <div id="help"><kbd>WASD</kbd> move &nbsp;<kbd>Shift</kbd> run &nbsp;<kbd>Space</kbd> jump<br><kbd>E</kbd> interact &nbsp;<kbd>Enter</kbd> chat</div>
  <div id="dialog" class="panel"><div class="name"></div><div class="text"></div><div class="next">▼</div></div>
  <div id="banner"><div class="line"></div><div class="t"></div><div class="s"></div><div class="line"></div></div>
  <div id="fade"></div>
  <div id="loading">LOADING</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/sprite.js"></script>
<script src="js/aditya-data.js"></script>
<script src="js/aditya-sheet.js"></script>
<script>
(() => {
  // ================= setup =================
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const PR = Math.min(window.devicePixelRatio || 1, 1.5);
  let resScale = 1, ftAcc = 0, ftN = 0;   // drops render resolution if the machine can't keep up

  const scene = new THREE.Scene();
  const FOG = 0xcdbf9f;
  scene.background = new THREE.Color(FOG);
  scene.fog = new THREE.Fog(FOG, 34, 95);
  const camera = new THREE.PerspectiveCamera(26, 16 / 9, 1, 220);
  const CAM_OFF = new THREE.Vector3(0, 10.5, 24.5);

  let seed = 1337;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const rr = (a, b) => a + rnd() * (b - a);

  // ================= pixel textures =================
  function canvasTex(w, h, draw, opts = {}) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); draw(g, w, h);
    const t = new THREE.CanvasTexture(c);
    t.magFilter = THREE.NearestFilter;
    t.minFilter = opts.nearest ? THREE.NearestFilter : THREE.LinearMipmapLinearFilter;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 8;
    return t;
  }
  const rgb = (c, f = 1) => `rgb(${Math.max(0, Math.min(255, c[0] * f)) | 0},${Math.max(0, Math.min(255, c[1] * f)) | 0},${Math.max(0, Math.min(255, c[2] * f)) | 0})`;
  const P = (g, x, y, c, f) => { g.fillStyle = rgb(c, f); g.fillRect(x, y, 1, 1); };
  function noiseFill(g, w, h, base, amt, chance = 1) {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (rnd() < chance) P(g, x, y, base, 1 + (rnd() - .5) * amt);
  }

  // stones laid in rows; tiles seamlessly
  function stoneTex(base, mortar, rowH = [5, 8], wid = [6, 12], size = 64) {
    return canvasTex(size, size, (g, W, H) => {
      g.fillStyle = rgb(mortar); g.fillRect(0, 0, W, H);
      let y = 0;
      while (y < H) {
        let rh = rowH[0] + (rnd() * (rowH[1] - rowH[0]) | 0); if (H - y < rh + rowH[0]) rh = H - y;
        const off = rnd() * W | 0; let x = 0;
        while (x < W) {
          let sw = wid[0] + (rnd() * (wid[1] - wid[0]) | 0); if (W - x < sw + wid[0]) sw = W - x;
          const v = (rnd() - .5) * 34, c = [base[0] + v + (rnd() - .5) * 12, base[1] + v, base[2] + v - rnd() * 10];
          for (let i = 1; i < sw; i++) for (let j = 1; j < rh; j++) {
            if ((i === 1 || i === sw - 1) && (j === 1 || j === rh - 1)) continue;
            let f = 1;
            if (j === 1 || i === 1) f = 1.16; else if (j === rh - 1 || i === sw - 1) f = .76;
            if (rnd() < .1) f *= .9;
            P(g, (x + i + off) % W, (y + j) % H, c, f);
          }
          x += sw;
        }
        y += rh;
      }
    });
  }
  const TX = {};
  function buildTextures() {
    TX.cobble = stoneTex([168, 156, 132], [78, 70, 60]);
    TX.flag = stoneTex([150, 146, 140], [70, 66, 62], [10, 14], [10, 18]);
    TX.stoneWall = stoneTex([138, 132, 122], [60, 56, 52], [6, 9], [9, 16], 32);
    TX.grass = canvasTex(64, 64, (g, W, H) => {
      noiseFill(g, W, H, [92, 128, 58], .22);
      for (let i = 0; i < 140; i++) { const x = rnd() * W | 0, y = rnd() * H | 0, c = rnd() < .5 ? [122, 160, 70] : [70, 104, 46]; P(g, x, y, c); P(g, x, (y + 1) % H, c, .9); }
    });
    TX.darkGrass = canvasTex(64, 64, (g, W, H) => { noiseFill(g, W, H, [70, 102, 50], .25); });
    TX.dirt = canvasTex(32, 32, (g, W, H) => { noiseFill(g, W, H, [120, 92, 64], .25); });
    TX.plaster = canvasTex(32, 32, (g, W, H) => {
      noiseFill(g, W, H, [222, 214, 196], .07);
      for (let i = 0; i < 6; i++) { let x = rnd() * W | 0, y = rnd() * H | 0; for (let k = 0; k < 4; k++) { P(g, x % W, y % H, [180, 170, 152]); x += rnd() < .5 ? 1 : 0; y++; } }
    });
    TX.wood = canvasTex(32, 32, (g, W, H) => {
      for (let x = 0; x < W; x++) { const plank = (x / 8 | 0), b = [112 + plank % 2 * 10, 74 + plank % 2 * 6, 46]; for (let y = 0; y < H; y++) P(g, x, y, b, x % 8 === 0 ? .62 : 1 + (rnd() - .5) * .1); }
      for (let i = 0; i < 10; i++) { const x = rnd() * W | 0, y = rnd() * H | 0; for (let k = 0; k < 5; k++) P(g, x, (y + k) % H, [80, 52, 32]); }
    });
    TX.darkWood = canvasTex(16, 16, (g, W, H) => { noiseFill(g, W, H, [74, 48, 32], .14); for (let y = 0; y < H; y += 5) for (let x = 0; x < W; x++) if (rnd() < .5) P(g, x, y, [58, 38, 26]); });
    TX.floor = canvasTex(32, 32, (g, W, H) => {
      for (let y = 0; y < H; y++) { const row = y / 8 | 0, b = [150 - row % 2 * 14, 108 - row % 2 * 10, 70]; for (let x = 0; x < W; x++) P(g, x, y, b, y % 8 === 0 || (x + row * 11) % 32 === 0 ? .7 : 1 + (rnd() - .5) * .08); }
    });
    TX.roof = canvasTex(32, 32, (g, W, H) => {
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const col = x % 6, row = y % 8;
        let f = [1.25, 1.1, 1, .9, .7, .5][col];
        if (row === 0) f *= .55; else if (row === 1) f *= 1.15;
        P(g, x, y, [74, 78, 84], f * (1 + (rnd() - .5) * .08));
      }
    });
    TX.lattice = canvasTex(32, 32, (g, W, H) => {
      g.fillStyle = '#2a1d14'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#5a3a24';
      for (let x = 0; x < W; x += 4) g.fillRect(x, 0, 1, H);
      for (let y = 0; y < H; y += 6) g.fillRect(0, y, W, 1);
      g.fillStyle = '#7a5032'; g.fillRect(0, 0, W, 2); g.fillRect(0, H - 2, W, 2); g.fillRect(0, 0, 2, H); g.fillRect(W - 2, 0, 2, H);
    }, { nearest: true });
    TX.door = canvasTex(32, 32, (g, W, H) => {
      noiseFill(g, W, H, [98, 64, 40], .1);
      g.fillStyle = '#3a2416'; g.fillRect(15, 0, 2, H);
      for (const x of [3, 19]) { g.fillStyle = '#4a2e1c'; g.fillRect(x, 3, 10, 26); g.fillStyle = '#6a4630'; for (let yy = 5; yy < 28; yy += 3) g.fillRect(x + 1, yy, 8, 1); }
      g.fillStyle = '#d9b46a'; g.fillRect(13, 16, 2, 2); g.fillRect(17, 16, 2, 2);
    }, { nearest: true });
    TX.cloth = canvasTex(16, 16, (g, W, H) => { for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) P(g, x, y, [150, 52, 40], x % 4 < 2 ? 1 : .86); });
    TX.bark = canvasTex(16, 16, (g, W, H) => { noiseFill(g, W, H, [86, 62, 44], .25); for (let x = 0; x < W; x += 3) for (let y = 0; y < H; y++) if (rnd() < .6) P(g, x, y, [60, 42, 30]); });
    const leaf = (base) => canvasTex(32, 32, (g, W, H) => {
      noiseFill(g, W, H, base, .18);
      for (let i = 0; i < 70; i++) {
        const x = rnd() * W | 0, y = rnd() * H | 0, f = rnd() < .5 ? 1.3 : .62;
        for (let k = 0; k < 5; k++) P(g, (x + [0, 1, -1, 0, 0][k] + W) % W, (y + [0, 0, 0, 1, -1][k] + H) % H, base, f * (k ? .92 : 1));
      }
    });
    TX.leafA = leaf([74, 116, 52]); TX.leafB = leaf([52, 92, 50]); TX.leafC = leaf([96, 132, 56]); TX.blossom = leaf([196, 128, 148]);
    TX.books = canvasTex(32, 32, (g, W, H) => {
      g.fillStyle = '#3b2618'; g.fillRect(0, 0, W, H);
      for (let shelf = 0; shelf < 4; shelf++) {
        let x = 1; const y0 = shelf * 8;
        g.fillStyle = '#6a4630'; g.fillRect(0, y0 + 7, W, 1);
        while (x < W - 1) { const w = 1 + (rnd() * 2 | 0), h = 4 + (rnd() * 3 | 0), c = [[140, 50, 40], [50, 80, 120], [180, 150, 80], [60, 110, 70], [120, 80, 140]][rnd() * 5 | 0]; g.fillStyle = rgb(c); g.fillRect(x, y0 + 7 - h, w, h); g.fillStyle = rgb(c, 1.3); g.fillRect(x, y0 + 7 - h, w, 1); x += w + (rnd() < .15 ? 1 : 0); }
      }
    }, { nearest: true });
    TX.rack = canvasTex(16, 32, (g, W, H) => {
      g.fillStyle = '#1b1d24'; g.fillRect(0, 0, W, H);
      for (let y = 2; y < H; y += 4) { g.fillStyle = '#2c303a'; g.fillRect(1, y, W - 2, 3); g.fillStyle = rnd() < .5 ? '#ffb347' : '#6ee07a'; g.fillRect(2, y + 1, 1, 1); g.fillStyle = '#ffb347'; if (rnd() < .5) g.fillRect(4, y + 1, 1, 1); }
    }, { nearest: true });
    TX.screen = canvasTex(32, 20, (g, W, H) => {
      g.fillStyle = '#0d2a36'; g.fillRect(0, 0, W, H);
      for (let y = 2; y < H - 1; y += 2) { const x0 = 2 + (rnd() * 4 | 0); g.fillStyle = rnd() < .3 ? '#ffd27a' : '#7fe6ff'; g.fillRect(x0, y, 4 + (rnd() * 20 | 0), 1); }
    }, { nearest: true });
    TX.paver = canvasTex(64, 64, (g, W, H) => {
      g.fillStyle = rgb([128, 122, 112]); g.fillRect(0, 0, W, H);
      for (let r = 0; r < 8; r++) for (let c = -1; c < 4; c++) {
        const x0 = c * 16 + (r % 2) * 8, y0 = r * 8, v = (rnd() - .5) * 26, b = [182 + v, 174 + v, 160 + v - rnd() * 8];
        for (let i = 1; i < 16; i++) for (let j = 1; j < 8; j++) { const x = x0 + i; if (x < 0 || x >= W) continue; P(g, x, y0 + j, b, (j === 1 ? 1.05 : j === 7 ? .9 : 1) * (1 + (rnd() - .5) * .05)); }
      }
    });
    TX.concrete = canvasTex(32, 32, (g, W, H) => {
      noiseFill(g, W, H, [196, 192, 184], .06);
      g.fillStyle = rgb([172, 168, 160]); g.fillRect(0, 15, W, 1); g.fillRect(15, 0, 1, H);
      for (const [x, y] of [[7, 7], [23, 7], [7, 23], [23, 23]]) P(g, x, y, [140, 136, 130]);
    });
    TX.cladding = canvasTex(32, 32, (g, W, H) => {
      for (let y = 0; y < H; y++) { const sl = y / 4 | 0, b = [[168, 116, 72], [150, 102, 62], [176, 124, 78]][sl % 3]; for (let x = 0; x < W; x++) P(g, x, y, b, y % 4 === 3 ? .55 : 1 + (rnd() - .5) * .08); }
    });
    TX.roofFlat = canvasTex(32, 32, (g, W, H) => { noiseFill(g, W, H, [124, 122, 118], .1); g.fillStyle = rgb([104, 102, 98]); g.fillRect(0, 0, W, 1); g.fillRect(0, 16, W, 1); });
    // curtain-wall glass: some panes reflect the sky, some show warm lit offices
    const lit = Array.from({ length: 4 }, () => Array.from({ length: 2 }, () => rnd() < .45));
    const glass = (emissive) => canvasTex(32, 32, (g, W, H) => {
      g.fillStyle = emissive ? '#000' : '#363a42'; g.fillRect(0, 0, W, H);
      for (let r = 0; r < 2; r++) for (let c = 0; c < 4; c++) {
        const x0 = c * 8 + 1, y0 = r * 16 + 1, on = lit[c][r];
        for (let j = 0; j < 14; j++) for (let i = 0; i < 7; i++) {
          let col;
          if (on) col = j > 9 ? [120, 92, 66] : [255, 214, 150];
          else { const t = j / 14; col = [150 - t * 60, 176 - t * 66, 196 - t * 66]; if ((i + j) % 9 === 0 || (i + j) % 9 === 1) col = col.map(v => v + 30); }
          if (emissive) col = on && j <= 9 ? [255, 190, 120] : [0, 0, 0];
          P(g, x0 + i, y0 + j, col);
        }
        if (!emissive) { g.fillStyle = '#4a4f58'; g.fillRect(x0, y0 + 10, 7, 1); }
      }
    }, { nearest: true });
    TX.glass = glass(false); TX.glassE = glass(true);
    TX.awning = canvasTex(16, 16, (g, W, H) => { for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) P(g, x, y, x % 8 < 4 ? [46, 120, 112] : [236, 226, 204]); }, { nearest: true });
    TX.coin = canvasTex(64, 64, (g, W, H) => {
      g.fillStyle = '#b8862c'; g.fillRect(0, 0, W, H);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const d = Math.hypot(x - 31.5, y - 31.5); if (d > 26 && d < 29) P(g, x, y, [140, 96, 30]); else if (d <= 26) P(g, x, y, [232, 186, 84], 1 - (x + y) / 400); }
      g.fillStyle = '#8a5e1c'; g.fillRect(20, 18, 24, 6); g.fillRect(29, 18, 6, 28);
      g.fillStyle = '#fff2c4'; g.fillRect(20, 18, 24, 1); g.fillRect(29, 18, 1, 28);
    }, { nearest: true });
    TX.coin.center.set(.5, .5); TX.coin.rotation = Math.PI / 2;
    TX.grassTuft = canvasTex(16, 16, (g, W, H) => {
      for (let i = 0; i < 9; i++) {
        let x = 2 + rnd() * 12, h = 6 + rnd() * 9; const c = [[96, 140, 60], [120, 160, 70], [76, 112, 48]][i % 3];
        for (let y = 0; y < h; y++) { P(g, x | 0, H - 1 - y, c, 1 + y / h * .25); x += (rnd() - .5) * .8; }
      }
    }, { nearest: true });
    TX.flowers = [[226, 70, 60], [246, 238, 220], [246, 200, 70], [170, 110, 220]].map(pc => canvasTex(16, 16, (g, W, H) => {
      for (let i = 0; i < 4; i++) {
        const x = 2 + i * 4 - (rnd() * 2 | 0), top = 4 + (rnd() * 6 | 0);
        for (let y = top; y < H; y++) P(g, x, y, [80, 120, 50]);
        P(g, x - 1, top, pc); P(g, x + 1, top, pc); P(g, x, top - 1, pc); P(g, x, top + 1, pc, .85); P(g, x, top, [250, 220, 120]);
        P(g, x + 1, top + 5, [96, 140, 60]);
      }
    }, { nearest: true }));
    const blob = document.createElement('canvas'); blob.width = blob.height = 64;
    const bg = blob.getContext('2d'), grd = bg.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, 'rgba(0,0,0,.55)'); grd.addColorStop(1, 'rgba(0,0,0,0)'); bg.fillStyle = grd; bg.fillRect(0, 0, 64, 64);
    TX.blob = new THREE.CanvasTexture(blob);
  }

  function textTex(text, opts = {}) {
    const w = opts.w || 256, h = opts.h || 48;
    return canvasTex(w, h, (g) => {
      g.fillStyle = opts.bg || '#6b4528'; g.fillRect(0, 0, w, h);
      g.fillStyle = opts.edge || '#3c2414'; g.fillRect(0, 0, w, 3); g.fillRect(0, h - 3, w, 3); g.fillRect(0, 0, 3, h); g.fillRect(w - 3, 0, 3, h);

  // ================= static batching =================
  // Thousands of boxes become a few dozen draw calls: bake every static, single-material mesh into one geometry
  // per (material, shadow-casting, zone). Zones are kept apart so the far-away areas still get frustum-culled.
  function mergeStatic() {
    scene.updateMatrixWorld(true);
    const buckets = new Map(), dead = [], wp = new THREE.Vector3();
    const dyn = o => { for (let p = o; p; p = p.parent) if (p.userData.dyn) return true; return false; };
    const ok = m => m.isMeshStandardMaterial && !m.transparent;
    scene.traverse(o => {
      if (!o.isMesh || o.isInstancedMesh || dyn(o)) return;
      const multi = Array.isArray(o.material);
      if (multi ? !o.material.every(ok) : !ok(o.material)) return;
      const g = o.geometry; if (!g.attributes.uv || !g.attributes.normal) return;
      o.getWorldPosition(wp);
      const zone = wp.x < -150 ? 'w' : wp.x > 150 ? 'e' : wp.z < -150 ? 'n' : 'l';
      const flat = g.index ? g.toNonIndexed() : g.clone(); flat.applyMatrix4(o.matrixWorld);
      // a multi-material mesh is split into one piece per material group (groups index the flattened vertices 1:1)
      const parts = multi ? g.groups.map(gr => [o.material[gr.materialIndex], gr.start, gr.count]) : [[o.material, 0, flat.attributes.position.count]];
      for (const [mat, start, count] of parts) {
        const key = mat.uuid + (o.castShadow ? 1 : 0) + zone;
        if (!buckets.has(key)) buckets.set(key, { mat, cast: o.castShadow, list: [] });
        buckets.get(key).list.push({ g: flat, start, count });
      }
      dead.push(o);
    });
    for (const o of dead) o.parent.remove(o);
    for (const { mat, cast, list } of buckets.values()) {
      let n = 0; for (const p of list) n += p.count;
      const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = new Float32Array(n * 2);
      let k = 0;
      for (const { g, start, count } of list) {
        const A = g.attributes;
        pos.set(A.position.array.subarray(start * 3, (start + count) * 3), k * 3); nor.set(A.normal.array.subarray(start * 3, (start + count) * 3), k * 3);
        uv.set(A.uv.array.subarray(start * 2, (start + count) * 2), k * 2); k += count;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
      geo.computeBoundingSphere();
      const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = true; scene.add(m);
    }
  }

  // ================= life: butterflies, drifting petals, cafe string lights =================
  const life = [];
  function buildLife() {
    const wingTex = canvasTex(8, 8, g => { g.fillStyle = '#fff'; g.fillRect(1, 1, 6, 5); g.fillRect(2, 6, 4, 1); g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(1, 1, 6, 1); }, { nearest: true });
    for (let i = 0; i < 7; i++) {
      const col = [0xfff2b0, 0xffffff, 0xffb070, 0xbfe3ff][i % 4];
      const m = new THREE.MeshStandardMaterial({ map: wingTex, color: col, emissive: col, emissiveIntensity: .3, alphaTest: .5, side: THREE.DoubleSide });
      const b = new THREE.Group(), wings = [];
      for (const s of [-1, 1]) { const w = new THREE.Mesh(new THREE.PlaneGeometry(.16, .16).translate(s * .08, 0, 0), m); wings.push(w); b.add(w); }
      scene.add(b);
      const cx = rr(-14, 14), cz = rr(6, 17), ph = rnd() * 9, sp = rr(.25, .45);
      life.push(t => {
        const a = t * sp + ph;
        b.position.set(cx + Math.sin(a) * 3 + Math.sin(a * 2.3) * .8, .7 + Math.sin(a * 3.1) * .35 + .3, cz + Math.cos(a * .8) * 2.2);
        b.rotation.y = -a; const f = Math.sin(t * 22 + ph) * 1.1; wings[0].rotation.y = f; wings[1].rotation.y = -f;
      });
    }
    // petals drifting off the blossom trees
    const n = 90, pos = new Float32Array(n * 3), seedA = [];
    const src = [[-10, 1.2], [15.2, 16]];
    const reset = (i, y) => { const s = src[i % 2]; pos[i * 3] = s[0] + rr(-1.4, 1.4); pos[i * 3 + 1] = y ?? rr(2.4, 3.6); pos[i * 3 + 2] = s[1] + rr(-1.2, 1.2); };
    for (let i = 0; i < n; i++) { reset(i, rr(0, 3.6)); seedA.push(rnd() * 9); }
    const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const petals = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xf2b6c6, size: .09 })); scene.add(petals);
    life.push((t, dt) => {
      for (let i = 0; i < n; i++) {
        pos[i * 3] += (Math.sin(t * 1.3 + seedA[i]) * .25 + .35) * dt; pos[i * 3 + 1] -= .32 * dt; pos[i * 3 + 2] += Math.cos(t + seedA[i]) * .12 * dt;
        if (pos[i * 3 + 1] < .02) reset(i);
      }
      pg.attributes.position.needsUpdate = true;
    });
    // string lights over the cafe tables
    const poles = [[9.2, -9.9], [15.9, -9.9], [15.9, -3.6], [9.2, -3.6]];
    for (const [x, z] of poles) { const p = new THREE.Mesh(new THREE.BoxGeometry(.1, 3.7, .1), MAT.metal); p.position.set(x, 1.85, z); p.castShadow = true; scene.add(p); colCirc(x, z, .15); }
    const bulbs = [], segs = [[0, 1], [1, 2], [2, 3], [3, 0], [0, 2]];
    for (const [a, b] of segs) {
      const A = poles[a], B = poles[b], len = Math.hypot(B[0] - A[0], B[1] - A[1]), cnt = Math.round(len / .6);
      for (let i = 1; i < cnt; i++) { const t = i / cnt; bulbs.push([A[0] + (B[0] - A[0]) * t, 3.6 - .55 * 4 * t * (1 - t), A[1] + (B[1] - A[1]) * t]); }
    }
    const bm = new THREE.InstancedMesh(new THREE.SphereGeometry(.07, 6, 4), new THREE.MeshStandardMaterial({ color: 0xffe2a0, emissive: 0xffc070, emissiveIntensity: 2.6 }), bulbs.length);
    const d = new THREE.Object3D(); bulbs.forEach((p, i) => { d.position.set(...p); d.updateMatrix(); bm.setMatrixAt(i, d.matrix); }); scene.add(bm);
  }

    npcs = NPC_NAMES.map(n => { const s = randomSpot(), c = makeChar(n, s.x, s.z, { speed: 2.2 }); c.wait = Math.random() * 3000; return c; });
    for (const [n, x, z] of [['rahul.k', -3.8, -6], ['meera_s', 2, -21.5], ['devansh', 0, 5]]) { const c = makeChar(n, x, -300 + z, { speed: 2.1, zone: 'lab' }); c.wait = Math.random() * 3000; npcs.push(c); }
    const q = new URLSearchParams(location.search);
    if (q.get('zone') && AREAS[q.get('zone')]) { const a = AREAS[q.get('zone')], sp = a.spawn || [0, 4.6]; hero.x = a.cx + sp[0]; hero.y = a.cz + sp[1]; hero.zone = q.get('zone'); }
    if (q.get('at')) { const [ax, az] = q.get('at').split(',').map(Number); hero.x = ax; hero.y = az; }
    setZone(hero.zone); resize(); snapCamera();
    document.getElementById('loading').remove();
    fadeEl.style.opacity = 0;
    showBanner('TokenFall', 'Main Plaza');
    log('', 'Welcome to TokenFall! Walk through a glowing gate to visit an area.', true);
    setTimeout(() => say(npcs[0], 'hi aditya! 👋'), 1800);
    requestAnimationFrame(t => { last = t; frame(t); });
  });
})();
</script>
</body>
</html>
