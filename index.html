  <div id="fade"></div>
  <div id="loading" role="status" aria-live="polite"><h1 class="stk ld-stk" aria-label="TokenFall"><b data-t="TOKEN">TOKEN</b><b class="b2" data-t="FALL">FALL</b></h1><p class="ld-line">Tokenizing the office</p><div class="ld-bar"><b></b></div></div>
  <script>
  // the loading lines: what a model does, told as if it were building the game; one every 1.4 s until main.js removes #loading
  (function () {
    // an AI step joined to a piece of the game, drawn from every pairing in a shuffled bag, so a line never comes back until all of them have shown
    var V = ['Tokenizing', 'Embedding', 'Training', 'Fine-tuning', 'Sampling', 'Prompting', 'Vectorizing', 'Benchmarking', 'Aligning', 'Distilling', 'Caching', 'Indexing', 'Retrieving', 'Debiasing', 'Fact-checking', 'Quantizing', 'Labelling', 'Evaluating', 'Grounding', 'Attending to'];
    var O = ['the office', 'the lobby', 'the coworkers', 'the city', 'the coffee', 'the carrom board', 'the glass bridge', 'the airport', 'the auto-rickshaws', 'the elevator', 'the potted plants', 'the leaderboard', 'the clouds', 'the chai', 'the Wi-Fi', 'the meeting rooms', 'the vada pav', 'the token tower', 'the traffic', 'the pigeons'];
    var bag = [], el = document.querySelector('#loading .ld-line');
    var next = function () { if (!bag.length) { for (var a = 0; a < V.length; a++) for (var b = 0; b < O.length; b++) bag.push(V[a] + ' ' + O[b]); for (var k = bag.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)), x = bag[k]; bag[k] = bag[j]; bag[j] = x; } } return bag.pop(); };
    el.textContent = next();
    var t = setInterval(function () { if (!document.getElementById('loading')) return clearInterval(t); el.classList.remove('in'); void el.offsetWidth; el.textContent = next(); el.classList.add('in'); }, 1400);
  })();
  </script>
