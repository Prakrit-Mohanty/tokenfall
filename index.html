<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TokenFall Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="tags"></div>
  <div id="prompt" class="panel"></div>
  <div id="loc" class="panel"><div class="gem"></div><div><span id="locName">TokenFall Lobby</span><small id="locSub">Main Plaza</small></div></div>
  <div id="party" class="panel"><h4><span>LOBBY</span><span id="count">5 / 20</span></h4><div id="plist"></div></div>
  <div id="chat"><div id="log" class="panel"></div><input id="chatIn" maxlength="80" placeholder="Press Enter to chat"></div>
  <div id="help"><kbd>WASD</kbd> move &nbsp;<kbd>Shift</kbd> run &nbsp;<kbd>Space</kbd> jump<br><kbd>E</kbd> interact &nbsp;<kbd>V</kbd> view &nbsp;<kbd>Enter</kbd> chat</div>
  <div id="dialog" class="panel"><div class="name"></div><div class="text"></div><div class="next">▼</div></div>
  <div id="banner"><div class="line"></div><div class="t"></div><div class="s"></div><div class="line"></div></div>
  <div id="fade"></div>
  <div id="loading">LOADING</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/sprites/sprite.js"></script>
<script src="js/sprites/aditya-data.js"></script>
<script src="js/sprites/aditya-sheet.js"></script>
<script src="js/bridge/bridge-content.js"></script>
<script src="js/bridge/bridge-generator.js"></script>
<script src="js/bridge/bridge-world.js"></script>
<script src="js/bridge/bridge-play.js"></script>
<script src="js/bridge/bridge-progress.js"></script>
<script>
(window.TokenFallReady = window.TokenFallReady || []).push((TF) => BridgePlay.install(TF));
</script>
<script src="js/game/setup.js"></script>
<script src="js/game/textures.js"></script>
<script src="js/game/geometry.js"></script>
<script src="js/game/props.js"></script>
<script src="js/game/buildings.js"></script>
<script src="js/game/portals.js"></script>
<script src="js/game/lobby.js"></script>
<script src="js/game/areas.js"></script>
<script src="js/game/office-kit.js"></script>
<script src="js/game/office-hq.js"></script>
<script src="js/game/office-abz.js"></script>
<script src="js/game/build-areas.js"></script>
<script src="js/game/effects.js"></script>
<script src="js/game/characters.js"></script>
<script src="js/game/ui.js"></script>
<script src="js/game/post.js"></script>
<script src="js/game/loop.js"></script>
<script src="js/game/main.js"></script>
</body>
</html>
