<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TokenFall Valley</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0a1430; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: 'VT323', monospace; }
    #stage { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; }
    #game { display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: pointer; }

    /* Stardew-style hotbar: dark outline, orange frame, tan slots with pixel icons */
    #bar {
      position: absolute; left: 50%; bottom: 1.5%; height: 9%; transform: translateX(-50%);
      display: flex; gap: .4%; padding: .5%;
      background: #e0903a; border: 3px solid #5a2e14; box-shadow: inset 0 0 0 2px #f8c070, inset 0 -4px 0 2px #b8642a;
    }
    .slot {
      position: relative; height: 100%; aspect-ratio: 1; padding: 0; cursor: pointer;
      background: #f8d8a0; border: 2px solid #b8642a; box-shadow: inset 2px 2px 0 #e8b878;
    }
    .slot:hover, .slot.sel { border-color: #d02a2a; }
    .slot img { width: 76%; height: 76%; image-rendering: pixelated; display: block; margin: auto; }
    .slot i {
      position: absolute; left: 3px; top: 1px; font: normal min(1.3vw, 2.3vh) 'VT323', monospace; color: #5a2e14;
    }
    #say {
      position: absolute; left: 1.5%; bottom: 12%; width: 28%; height: 5.5%;
      padding: 0 .6em; outline: none; box-sizing: border-box;
      font: min(1.9vw, 3.4vh) 'VT323', monospace; color: #fff3d6;
      background: rgba(40, 22, 10, .6); border: 2px solid #5a2e14;
    }
    #say::placeholder { color: rgba(255, 243, 214, .6); }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <input id="say" maxlength="60" placeholder="Press Enter to chat…">
    <div id="bar"></div>
  </div>

  <script src="js/sprite.js"></script>
  <script src="js/aditya-data.js"></script>
  <script>
  (function () {
    // World is 720x480; the camera shows 480x270 of it. The frame buffer is full-res with a 2x transform,
    // so world art lands on 2x2 blocks while characters get every device pixel and stay sharp.
    const WW = 720, WH = 480, BW = 480, BH = 270, K = 2;
    const view = document.getElementById('game'), vctx = view.getContext('2d');
    const buf = document.createElement('canvas'); buf.width = BW * K; buf.height = BH * K;
    const b = buf.getContext('2d');
    b.imageSmoothingEnabled = false;
    const bg = document.createElement('canvas'); bg.width = WW; bg.height = WH;

    // Characters are 38x40 world px (1/5 of the 190x200 cells), drawn from a 2/5-size sheet (76x80 cells).
    const S = 0.2, CW = 38, CH = 40, AX = 19, AY = 39, SCW = CW * K, SCH = CH * K;
    const DATA = window.ADITYA;

    const OUT = '#2a160c';
    const mkRng = s => () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    const rnd = mkRng(23);
    const pick = a => a[Math.floor(Math.random() * a.length)];

    function P(ctx, c, x, y, w = 1, h = 1) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
    function circ(ctx, cx, cy, r, c) { for (let dy = -r; dy <= r; dy++) { const hw = Math.floor(Math.sqrt(r * r - dy * dy)); P(ctx, c, cx - hw, cy + dy, hw * 2 + 1, 1); } }
    function oval(ctx, cx, cy, rx, ry, c) { for (let dy = -ry; dy <= ry; dy++) { const hw = Math.round(rx * Math.sqrt(1 - (dy / ry) ** 2)); P(ctx, c, cx - hw, cy + dy, hw * 2 + 1, 1); } }
    const inRect = (x, y, r) => x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3];
    const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

    // Crisp bitmap text: rasterise the 8px pixel font, threshold it, then stamp each pixel at `scale`.
    const glyphCache = {};
    function pixelText(ctx, str, x, y, scale, color) {
      let g = glyphCache[str];
      if (!g) {
        const t = document.createElement('canvas'); t.width = str.length * 8; t.height = 8;
        const c = t.getContext('2d');
        c.font = '8px "Press Start 2P", monospace'; c.textBaseline = 'top'; c.fillText(str, 0, 0);
        g = glyphCache[str] = { w: t.width, d: c.getImageData(0, 0, t.width, 8).data };
      }
      const ox = Math.round(x - (g.w * scale) / 2);
      ctx.fillStyle = color;
      for (let j = 0; j < 8; j++) for (let i = 0; i < g.w; i++)
        if (g.d[(j * g.w + i) * 4 + 3] > 110) ctx.fillRect(ox + i * scale, y + j * scale, scale, scale);
    }
    function board(g, x, y, w, h, text) {
      P(g, OUT, x - 1, y - 1, w + 2, h + 2); P(g, '#b8642a', x, y, w, h); P(g, '#f0c880', x + 1, y + 1, w - 2, h - 2);
      P(g, '#d8a060', x + 1, y + h - 2, w - 2, 1);
      pixelText(g, text, x + w / 2, y + Math.floor((h - 8) / 2), 1, OUT);
    }

    // ---------- map shape ----------
    // Mountains along the top (cliff face below `ridge`), sea along the bottom (beach above `shore`),
    // and a river from a waterfall in the cliff winding down to the sea, splitting town (west) from farm (east).
    const CLIFF = 14, SAND = 34;
    const ridge = x => Math.round(64 + 6 * Math.sin(x * 0.035) + 4 * Math.sin(x * 0.09 + 2));
    const shore = x => 428 + 7 * Math.sin(x * 0.02) + 4 * Math.sin(x * 0.05 + 1);
    const riverX = y => 460 + 40 * Math.sin((y - 60) / 90) - (y - 60) * 0.25;
    const riverW = y => y < 70 ? 8 : 13 + (y - 70) * 0.02;
    const riverAt = (x, y) => Math.abs(x - riverX(y)) < riverW(y) && y < shore(x) + 4;
    const waterAt = (x, y) => y > shore(x) || riverAt(x, y);
    const sandAt = (x, y) => y > shore(x) - SAND + 3 * Math.sin(x * 0.13);
    const groundAt = (x, y) => !waterAt(x, y) && y > ridge(x) + CLIFF + 2;

    const PLAZA = [150, 168, 184, 112];
    const FIELDS = [[500, 200, 96, 52], [608, 200, 96, 52]];
    const PEN = [520, 288, 110, 56];
    const BRIDGES = [[448, 144, 46, 12], [370, 324, 56, 12], [324, 394, 56, 12]];
    const PIER = [186, 400, 16, 72];
    const PATHS = [
      [[334, 214], [384, 186], [436, 152], [500, 150], [560, 162], [610, 184]],
      [[356, 158], [350, 190], [334, 214]],
      [[58, 162], [100, 200], [150, 222]],
      [[240, 282], [242, 340], [226, 384], [196, 404]],
      [[300, 280], [350, 322], [430, 330], [500, 326], [560, 292]],
      [[150, 240], [110, 268], [60, 304]],
      [[300, 400], [380, 400], [440, 392], [520, 360], [560, 346]],
      [[540, 196], [560, 196]],
    ];
    function distToPath(x, y) {
      let best = 1e9;
      PATHS.forEach(line => {
        for (let i = 0; i < line.length - 1; i++) {
          const [ax, ay] = line[i], [bx, by] = line[i + 1];
          const dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy)));
          best = Math.min(best, Math.hypot(x - ax - t * dx, y - ay - t * dy));
        }
      });
      return best;
    }
    // footprints kept clear of grass/bushes/forage
    const BUILT = [[24, 50, 128, 118], [168, 40, 156, 140], [330, 74, 112, 94], [28, 220, 96, 92], [552, 88, 150, 100],
      [636, 280, 60, 46], [528, 172, 28, 24], [166, 160, 28, 30], PLAZA, ...FIELDS, PEN];
    const busy = (x, y, pad = 8) => BUILT.some(r => inRect(x, y, [r[0] - pad, r[1] - pad, r[2] + pad * 2, r[3] + pad * 2])) || distToPath(x, y) < 12;

    // ---------- static background ----------
    function drawBackground() {
      const g = bg.getContext('2d');
      const id = g.createImageData(WW, WH), d = id.data;
      const C = {
        foam: hex('#e8f4ff'), shallow: hex('#5aa8e8'), sea: hex('#3a88d8'), deep: hex('#2a6ac0'),
        river: hex('#3a80d0'), bank: hex('#7a5a30'), bankL: hex('#a8844a'), foam2: hex('#9cc8ff'),
        rim: hex('#f0b860'), c1: hex('#d48a3a'), c2: hex('#b0602a'), streak: hex('#8a4418'), c3: hex('#6a3414'),
        g0: hex('#4f9a32'), g1: hex('#448a2a'), g2: hex('#5aaa3a'), dirtRim: hex('#8a6a3a'),
        mount: hex('#2c6420'), lip: hex('#5aaa35'),
        sand: hex('#f0d8a0'), sand2: hex('#e0c088'), sand3: hex('#fff0c8'), wet: hex('#d8b878'),
        path: hex('#c8a46a'), path2: hex('#b8945a'), pathEdge: hex('#a8844a'),
      };
      const set = (x, y, c) => { const i = (y * WW + x) * 4; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255; };
      const cliffColor = (k, x) => k === 1 ? C.rim : k <= 3 ? C.c1 : k <= 10 ? ((x * 37) % 7 === 0 ? C.streak : C.c2) : C.c3;
      for (let y = 0; y < WH; y++) for (let x = 0; x < WW; x++) {
        const sh = shore(x), rg = ridge(x), r = rnd();
        let c;
        if (y > sh) { const dd = y - sh; c = dd < 2 ? C.foam : dd < 6 ? C.shallow : dd < 16 ? C.sea : C.deep; }
        else if (riverAt(x, y)) {
          let k = 0;
          for (let i = 1; i <= 4; i++) if (!riverAt(x, y - i)) { k = i; break; }
          c = y < rg + CLIFF ? C.river : k === 1 ? C.bankL : k && k <= 3 ? C.bank : k === 4 ? C.foam2 : C.river;
        }
        else if (y < rg - 2) c = C.mount;
        else if (y < rg) c = C.lip;
        else if (y < rg + CLIFF) c = cliffColor(y - rg + 1, x);
        else if (sandAt(x, y) || (sandAt(x, y + 2) && r < 0.5)) c = y > sh - 5 ? C.wet : r < 0.1 ? C.sand2 : r < 0.15 ? C.sand3 : C.sand;
        else {
          const dp = distToPath(x, y);
          if (dp < 4) c = r < 0.15 ? C.path2 : C.path;
          else if (dp < 6) c = r < 0.6 ? C.pathEdge : C.g1;
          else if (riverAt(x - 2, y) || riverAt(x + 2, y)) c = C.dirtRim;
          else c = r < 0.08 ? C.g1 : r < 0.12 ? C.g2 : C.g0;
        }
        set(x, y, c);
      }
      g.putImageData(id, 0, 0);

      // water texture
      for (let i = 0; i < 700; i++) {
        const x = rnd() * WW, y = rnd() * WH;
        if (waterAt(x, y) && y > ridge(x) + CLIFF) P(g, rnd() < 0.7 ? '#5a9ae0' : '#2a62b0', x, y, 3 + rnd() * 4, 1);
      }

      // mountain top: forest canopy, pines and boulders (kept off the stream)
      for (let x = -6; x < WW + 10; x += 12) {
        if (Math.abs(x - 460) < 16) continue;
        const y = 10 + rnd() * (ridge(x) - 26), rr = 10 + Math.floor(rnd() * 5), v = rnd();
        const [o, d1, m1, l1] = v < 0.15 ? ['#0c2a22', '#1a4a3a', '#2a6a4a', '#4a9a6a'] : v < 0.3 ? ['#123a10', '#2f7a26', '#47a838', '#7ac84a'] : ['#10300f', '#21581f', '#348a2c', '#5fb83a'];
        circ(g, x, y, rr + 1, o); circ(g, x, y, rr, d1); circ(g, x - 3, y - 3, rr - 4, m1); P(g, l1, x - 6, y - 7, 3, 2); P(g, l1, x - 2, y - 9, 2, 1);
      }
      [[40, 46, 51], [120, 40, 49], [220, 44, 53], [330, 48, 57], [560, 46, 59], [650, 42, 61]].forEach(([x, y, sd]) => pine(g, x, y, sd));
      [[150, 52], [400, 50], [612, 54]].forEach(([x, y]) => { oval(g, x, y, 9, 6, OUT); oval(g, x, y, 8, 5, '#7a7a8a'); oval(g, x - 2, y - 2, 4, 2, '#a0a0b0'); });

      // old mine entrance cut into the cliff
      const mx = 696, mr = ridge(mx);
      P(g, OUT, mx - 18, mr - 22, 36, CLIFF + 23); P(g, '#6a6a7a', mx - 17, mr - 21, 34, CLIFF + 21);
      for (let i = 0; i < 40; i++) P(g, rnd() < 0.5 ? '#8a8a9a' : '#4a4a58', mx - 16 + rnd() * 32, mr - 20 + rnd() * 32, 2, 1);
      P(g, '#3a7a2a', mx - 18, mr - 23, 36, 2);
      P(g, '#120a08', mx - 10, mr - 12, 20, CLIFF + 12); P(g, '#120a08', mx - 8, mr - 14, 16, 2);
      P(g, OUT, mx - 13, mr - 17, 26, 5); P(g, '#8a5a32', mx - 12, mr - 16, 24, 3);
      [mx - 13, mx + 10].forEach(x => { P(g, OUT, x, mr - 14, 4, CLIFF + 14); P(g, '#8a5a32', x + 1, mr - 13, 2, CLIFF + 13); });
      [mr - 6, mr + 3].forEach(y => { P(g, OUT, mx - 11, y - 1, 22, 5); P(g, '#a8703a', mx - 10, y, 20, 3); P(g, '#5a3218', mx - 8, y + 1, 1, 1); P(g, '#5a3218', mx + 7, y + 1, 1, 1); });
      P(g, OUT, mx + 17, mr - 8, 7, 9); P(g, '#ffd27a', mx + 18, mr - 7, 5, 7);

      // cobblestone town square
      const stone = (sx, sy) => {
        const shade = rnd() < 0.5 ? '#b8a07a' : '#a08a68';
        P(g, '#5a4630', sx - 1, sy, 7, 5); P(g, '#5a4630', sx, sy - 1, 5, 7);
        P(g, shade, sx, sy, 5, 5); P(g, '#d8c49a', sx, sy, 4, 1); P(g, '#7a6448', sx + 1, sy + 4, 4, 1);
        if (rnd() < 0.12) P(g, '#5a8a3a', sx + 3, sy + 2, 2, 1);
      };
      const [qx, qy, qw, qh] = PLAZA, inPlaza = (x, y) => {
        if (!inRect(x, y, PLAZA)) return false;
        const r = 14, cx = Math.max(qx + r, Math.min(qx + qw - r, x)), cy = Math.max(qy + r, Math.min(qy + qh - r, y));
        return (x - cx) ** 2 + (y - cy) ** 2 <= r * r;
      };
      for (let y = qy - 2; y < qy + qh + 3; y++) for (let x = qx - 2; x < qx + qw + 3; x++) if (!inPlaza(x, y) && (inPlaza(x + 2, y) || inPlaza(x - 2, y) || inPlaza(x, y - 2) || inPlaza(x, y + 2))) P(g, '#5a4630', x, y);
      for (let y = qy; y <= qy + qh; y++) for (let x = qx; x <= qx + qw; x++) if (inPlaza(x, y)) P(g, '#7a6448', x, y);
      for (let row = 0, y = qy + 1; y < qy + qh - 3; y += 6, row++)
        for (let x = qx + (row % 2 ? 4 : 1); x < qx + qw - 5; x += 7) if (inPlaza(x, y) && inPlaza(x + 5, y + 5)) stone(x + (rnd() * 2 - 1), y);

      // flower beds around the square
      [[150, 162, 20], [316, 162, 20], [140, 286, 30], [316, 286, 30]].forEach(([x, y, w]) => {
        for (let i = 0; i < w; i++) {
          const fx = x + rnd() * w, fy = y + rnd() * 6;
          P(g, '#2f7a26', fx, fy + 1, 1, 2); P(g, ['#e0505a', '#ffd23f', '#f08ac0', '#ffffff', '#9a7ae0'][Math.floor(rnd() * 5)], fx - 1, fy, 3, 1);
        }
      });

      // farm fields: tilled rows of crops
      const CROPS = [
        (x, y) => { oval(g, x, y - 2, 4, 2, '#348a2c'); circ(g, x, y - 4, 3, OUT); circ(g, x, y - 4, 2, '#f4f0e0'); P(g, '#ffffff', x - 1, y - 6, 1, 1); },
        (x, y) => { P(g, '#348a2c', x - 5, y - 1, 10, 1); oval(g, x, y - 3, 5, 3, OUT); oval(g, x, y - 3, 4, 2, '#e07a20'); P(g, '#b85a10', x - 1, y - 5, 1, 4); P(g, '#5a3218', x, y - 7, 1, 2); },
        (x, y) => { P(g, '#5fb83a', x - 1, y - 7, 1, 6); P(g, '#5fb83a', x + 1, y - 6, 1, 5); P(g, '#348a2c', x - 3, y - 5, 2, 1); P(g, '#f0e0a0', x - 1, y - 1, 3, 2); },
        (x, y) => { circ(g, x, y - 4, 4, OUT); circ(g, x, y - 4, 3, '#21581f'); [[-1, -5], [1, -3], [-2, -2], [2, -6]].forEach(([dx, dy]) => P(g, '#5a8ae8', x + dx, y + dy, 1, 1)); },
        (x, y) => { P(g, '#348a2c', x, y - 9, 1, 9); P(g, '#348a2c', x - 3, y - 6, 3, 1); P(g, '#348a2c', x + 1, y - 4, 3, 1); P(g, OUT, x - 2, y - 13, 5, 5); P(g, '#ffd23f', x - 1, y - 12, 3, 3); P(g, '#7a4a1a', x, y - 11, 1, 1); },
      ];
      FIELDS.forEach(([fx, fy, fw, fh], fi) => {
        P(g, '#3a2414', fx - 1, fy - 1, fw + 2, fh + 2); P(g, '#5a3a22', fx, fy, fw, fh);
        for (let y = fy + 4; y < fy + fh; y += 10) { P(g, '#4a2e1a', fx + 2, y + 5, fw - 4, 2); P(g, '#6e4a2c', fx + 2, y, fw - 4, 1); }
        for (let i = 0; i < 40; i++) P(g, '#4a2e1a', fx + rnd() * fw, fy + rnd() * fh, 2, 1);
        for (let row = 0; row < 4; row++) for (let x = fx + 8; x < fx + fw - (fi ? 18 : 4); x += 12) CROPS[(row + fi * 2) % CROPS.length](x, fy + 12 + row * 10);
        [fx - 2, fx + fw - 1].forEach(x => { for (let y = fy - 2; y < fy + fh; y += 8) { P(g, OUT, x - 1, y, 4, 9); P(g, '#e8d8b0', x, y + 1, 2, 7); } });
      });
      // chicken pen: packed dirt with straw
      const [px, py, pw, ph] = PEN;
      P(g, '#9a7a48', px, py, pw, ph);
      for (let i = 0; i < 120; i++) P(g, rnd() < 0.5 ? '#e0c060' : '#8a6a3a', px + rnd() * pw, py + rnd() * ph, 2 + rnd() * 2, 1);
      [px - 2, px + pw - 1].forEach(x => { for (let y = py - 2; y < py + ph; y += 8) { P(g, OUT, x - 1, y, 4, 9); P(g, '#a8703a', x, y + 1, 2, 7); } });

      // grass clumps and flowering bushes
      const okDeco = (x, y) => groundAt(x, y) && groundAt(x, y - 8) && groundAt(x - 8, y) && groundAt(x + 8, y) && !sandAt(x, y + 4) && !busy(x, y);
      for (let i = 0; i < 360; i++) {
        const cx = rnd() * WW, cy = 80 + rnd() * 340;
        if (!okDeco(cx, cy)) continue;
        P(g, '#2f6a1f', cx - 7, cy, 15, 1);
        for (let j = 0; j < 24; j++) {
          const bx = cx + (rnd() * 2 - 1) * 7, h = 3 + Math.floor(rnd() * 5);
          P(g, ['#3a8a2a', '#5aaa3a', '#6fc04a'][Math.floor(rnd() * 3)], bx, cy - h, 1, h);
          if (rnd() < 0.15) P(g, '#f4a8d0', bx, cy - h - 1, 1, 1);
        }
      }
      for (let i = 0; i < 90; i++) {
        const cx = rnd() * WW, cy = 84 + rnd() * 320;
        if (!okDeco(cx, cy) || !okDeco(cx, cy - 10)) continue;
        const rx = 8 + Math.floor(rnd() * 5), ry = 6 + Math.floor(rnd() * 3);
        oval(g, cx, cy - ry, rx + 1, ry + 1, '#123a14'); oval(g, cx, cy - ry, rx, ry, '#2a6a22');
        for (let j = 0; j < 24; j++) {
          const lx = cx + (rnd() * 2 - 1) * (rx - 2), ly = cy - ry + (rnd() * 2 - 1) * (ry - 2);
          P(g, ly < cy - ry ? '#6fc04a' : '#3f9a32', lx, ly, 2, 2);
        }
        for (let j = 0; j < 4; j++) P(g, pick(['#f4a8d0', '#ffffff', '#ffd23f']), cx + (rnd() * 2 - 1) * rx * 0.7, cy - ry + (rnd() * 2 - 1) * ry * 0.7, 2, 1);
      }
      // stumps, weeds, twigs, pebbles and mushrooms
      for (let i = 0, placed = 0; i < 800 && placed < 60; i++) {
        const x = rnd() * WW, y = 84 + rnd() * 320;
        if (!okDeco(x, y)) continue;
        placed++;
        if (placed % 9 === 0) { P(g, OUT, x - 6, y - 7, 12, 8); P(g, '#8a5a32', x - 5, y - 6, 10, 6); oval(g, x, y - 7, 5, 2, '#c8945a'); oval(g, x, y - 7, 2, 1, '#8a5a32'); }
        else if (placed % 5 === 0) { P(g, OUT, x - 2, y - 5, 5, 5); P(g, '#f0e8d8', x - 1, y - 3, 3, 3); oval(g, x, y - 5, 3, 2, OUT); oval(g, x, y - 5, 2, 1, '#d03a3a'); P(g, '#ffffff', x - 1, y - 6, 1, 1); }
        else if (placed % 3 === 1) { P(g, '#2f6a1f', x - 4, y - 1, 9, 1); [-3, -1, 1, 3].forEach((j, n) => { const h = 4 + (n % 2) * 3; P(g, OUT, x + j - 1, y - h - 1, 3, h + 1); P(g, '#3a9a2a', x + j, y - h, 1, h); }); }
        else if (placed % 3 === 2) { P(g, OUT, x - 5, y - 3, 11, 3); P(g, '#8a5a32', x - 4, y - 2, 9, 1); P(g, OUT, x + 1, y - 5, 2, 2); P(g, '#8a5a32', x + 1, y - 4, 1, 1); }

      f(OUT, x + 4, y, w - 8, h); f(OUT, x, y + 4, w, h - 8); f(OUT, x + 2, y + 2, w - 4, h - 4);
      f('#b8642a', x + 4, y + 2, w - 8, h - 4); f('#b8642a', x + 2, y + 4, w - 4, h - 8);
      f('#e0903a', x + 6, y + 6, w - 12, h - 12); f('#f8c070', x + 6, y + 6, w - 12, 2);
      f('#b8642a', x + 10, y + 10, w - 20, h - 20); f('#f8e0b0', x + 12, y + 12, w - 24, h - 24);
    }
    function drawDialog(dt) {
      dialog.shown = Math.min(dialog.text.length, dialog.shown + dt * 0.04);
      const npc = dialog.npc, x = 24, y = 336, w = npc ? 680 : 912, h = 192;
      vFrame(x, y, w, h);
      vctx.font = '30px VT323'; vctx.fillStyle = '#5a2e14'; vctx.textAlign = 'left';
      let left = Math.floor(dialog.shown);
      wrap(vctx, dialog.text, w - 70).forEach((l, i) => { if (left > 0) vctx.fillText(l.slice(0, left), x + 34, y + 54 + i * 32); left -= l.length + 1; });
      if (dialog.shown >= dialog.text.length) {
        const ay = y + h - 36 + Math.round(Math.sin(tNow / 150) * 3);
        vctx.fillStyle = '#b8323a';
        [[0, 0, 14], [2, 2, 10], [4, 4, 6], [6, 6, 2]].forEach(([dx, dy, ww]) => vctx.fillRect(x + w - 52 + dx, ay + dy, ww, 2));
      }
      if (npc) {
        const px = 716, pw = 220, fx = px + 46, fy = y + 18, fs = 128;
        vFrame(px, y, pw, h);
        vctx.fillStyle = '#b8642a'; vctx.fillRect(fx - 4, fy - 4, fs + 8, fs + 8);
        vctx.fillStyle = '#d8b880'; vctx.fillRect(fx, fy, fs, fs);
        vctx.save(); vctx.beginPath(); vctx.rect(fx, fy, fs, fs); vctx.clip();
        vctx.imageSmoothingEnabled = false;
        // portrait: the head of the idle-facing-down frame from the full-size sheet
        vctx.drawImage(img, 45, DATA.animations.idle_down.row * 200 + 5, 100, 100, fx, fy, fs, fs);
        if (npc.hat) {
          const sc = fs / 100, [dark, light] = npc.hat;
          const hr = (dx, dy, ww, hh, c) => { vctx.fillStyle = c; vctx.fillRect(fx + (95 + dx * 5 - 45) * sc, fy + ((dy + 39) * 5 - 5) * sc, ww * 5 * sc, hh * 5 * sc); };
          hr(-6, -36, 13, 2, dark); hr(-7, -34, 15, 3, dark); hr(-8, -31, 17, 2, light); hr(-1, -38, 3, 2, '#ffffff');
        }
        vctx.restore();
        uiText(npc.name, px + pw / 2, y + h - 22, 30);
      }
    }

    function drawNotices(dt) {
      for (let i = notices.length - 1; i >= 0; i--) { notices[i].t += dt; if (notices[i].t > 3500) notices.splice(i, 1); }
      notices.slice(0, 4).forEach((n, i) => {
        const x = 20 - (n.t > 3200 ? (n.t - 3200) * 1.2 : 0), y = 376 - i * 62;
        vFrame(x, y, 250, 58);
        vctx.imageSmoothingEnabled = false;
        vctx.drawImage(forageIcons[n.name], x + 14, y + 8, 42, 42);
        uiText(n.name, x + 66, y + 37, 26, 'left');
        uiText('x' + bag[n.name], x + 232, y + 37, 26, 'right', '#b8642a');
      });
    }
    function drawFloaters(dt) {
      for (let i = floaters.length - 1; i >= 0; i--) {
        const f = floaters[i]; f.t += dt;
        if (f.t > 1200) { floaters.splice(i, 1); continue; }
        vctx.globalAlpha = 1 - f.t / 1200;
        label(f.text, (f.x - camX) * K, (f.y - camY - f.t * 0.02) * K, '#a8f070', 24);
        vctx.globalAlpha = 1;
      }
    }

    // ---------- hotbar ----------
    function icon(fn) { const c = document.createElement('canvas'); c.width = c.height = 16; fn(c.getContext('2d')); return c.toDataURL(); }
    const ICONS = {
      jump: g => { P(g, OUT, 4, 3, 6, 9); P(g, OUT, 4, 10, 10, 4); P(g, '#8a4a22', 5, 4, 4, 8); P(g, '#8a4a22', 5, 11, 8, 2); P(g, '#c07a3a', 5, 4, 1, 7); P(g, '#5a2e14', 5, 12, 9, 1); },
      emote: g => { P(g, OUT, 3, 5, 10, 9); P(g, OUT, 4, 1, 2, 5); P(g, OUT, 7, 0, 2, 6); P(g, OUT, 10, 1, 2, 5); P(g, '#e8b088', 4, 6, 8, 7); [4, 7, 10].forEach(x => P(g, '#e8b088', x, 2, 1, 4)); P(g, '#c88a68', 4, 12, 8, 1); },
      shoot: g => { P(g, OUT, 1, 4, 14, 10); P(g, '#5a5a6a', 2, 5, 12, 8); P(g, OUT, 4, 2, 5, 3); P(g, '#8a8a9a', 5, 3, 3, 1); circ(g, 8, 9, 3, OUT); circ(g, 8, 9, 2, '#3a6ad8'); P(g, '#ffffff', 7, 8, 1, 1); P(g, '#ffd23f', 12, 6, 1, 1); },
      crouch: g => { P(g, OUT, 3, 1, 3, 14); P(g, OUT, 3, 8, 11, 3); P(g, OUT, 12, 8, 2, 7); P(g, '#c07a3a', 4, 2, 1, 12); P(g, '#c07a3a', 4, 9, 9, 1); P(g, '#c07a3a', 12, 10, 1, 4); },
      tea: g => { P(g, OUT, 2, 6, 10, 8); P(g, '#ffffff', 3, 7, 8, 6); P(g, '#c07a3a', 3, 7, 8, 2); P(g, OUT, 12, 8, 2, 4); P(g, OUT, 1, 14, 14, 1); P(g, '#c8c8d8', 6, 2, 1, 3); P(g, '#c8c8d8', 8, 1, 1, 3); },
      coin: g => { circ(g, 8, 8, 6, OUT); circ(g, 8, 8, 5, '#e0a020'); circ(g, 8, 8, 3, '#ffd23f'); P(g, '#fff3a0', 6, 5, 2, 1); P(g, '#a86a10', 8, 6, 1, 5); },
    };
    const SLOTS = [['jump', 'Jump'], ['emote', 'Wave'], ['shoot', 'Snap'], ['crouch', 'Sit'], ['tea', 'Sip chai'], ['coin', 'Flip a token']];
    const bar = document.getElementById('bar');
    function useSlot(i) {
      const [act] = SLOTS[i];
      bar.querySelectorAll('.slot').forEach((s, j) => s.classList.toggle('sel', j === i));
      if (act === 'tea') { say(hero, '*sips chai* ahh'); hero.trigger('emote'); }
      else if (act === 'coin') { const h = Math.random() < 0.5; say(hero, h ? 'heads!' : 'tails!'); gold += h ? 1 : -1; hero.trigger('jump'); }
      else hero.trigger(act);
    }
    SLOTS.forEach(([act, title], i) => {
      const btn = document.createElement('button');
      btn.className = 'slot'; btn.title = `${title} (${i + 1})`;
      btn.innerHTML = `<img alt="" src="${icon(ICONS[act])}"><i>${i + 1}</i>`;
      btn.addEventListener('click', () => { useSlot(i); btn.blur(); });
      bar.appendChild(btn);
    });

    // Stardew-ish pixel cursor
    (function () {
      const rows = ['X........', 'XX.......', 'XyX......', 'XyoX.....', 'XyooX....', 'XyoooX...', 'XyooooX..', 'XyoooooX.', 'XyooooooX', 'XyooXXXXX', 'XyoX.....', 'XoX......', 'XX.......'];
      const pal = { X: '#5a2e14', o: '#e0903a', y: '#f8d080' };
      const c = document.createElement('canvas'); c.width = 27; c.height = 39;
      const g = c.getContext('2d');
      rows.forEach((r, j) => [...r].forEach((ch, i) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(i * 3, j * 3, 3, 3); } }));
      const cur = `url(${c.toDataURL()}) 1 1, auto`;
      [view, bar, ...bar.querySelectorAll('.slot')].forEach(el => { el.style.cursor = cur; });
    })();

    // ---------- input ----------
    const MOVE = { arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down', arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right' };
    const KEYS = { f: 'shoot', e: 'emote', c: 'crouch', x: 'faint' };
    const sayEl = document.getElementById('say');
    let camX = 0, camY = 0;

    window.addEventListener('keydown', e => {
      if (e.target === sayEl) {
        if (e.key === 'Enter') { const t = sayEl.value.trim(); if (t) say(hero, t); sayEl.value = ''; sayEl.blur(); }
        if (e.key === 'Escape') sayEl.blur();
        return;
      }
      const k = e.key.toLowerCase();
      if (k === 'enter' || k === 't') { e.preventDefault(); sayEl.focus(); return; }
      if (k === 'shift') { hero.input.run = true; return; }
      if (k === 'escape' && dialog) { closeDialog(); return; }
      if (MOVE[k]) { e.preventDefault(); if (dialog) return; hero.target = null; hero.pending = null; hero.input[MOVE[k]] = true; return; }
      if (e.repeat) return;
      if (k >= '1' && k <= String(SLOTS.length)) { useSlot(+k - 1); return; }
      if (k === ' ') {
        e.preventDefault();
        if (dialog) { advanceDialog(); return; }
        const f = nearForage(), npc = nearNpc(), d = nearSpot();
        if (f) pickUp(f);
        else if (npc) talk(npc);
        else if (d) { if (d.text) openDialog(d.text); if (d.act) d.act(); }
        else hero.trigger('jump');
      } else if (KEYS[k]) hero.trigger(KEYS[k]);
    });
    window.addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      if (k === 'shift') hero.input.run = false;
      if (MOVE[k]) hero.input[MOVE[k]] = false;
    });
    window.addEventListener('blur', () => hero.setInput({ up: false, down: false, left: false, right: false, run: false }));

    view.addEventListener('click', e => {
      if (dialog) { advanceDialog(); return; }
      const r = view.getBoundingClientRect();
      const wx = camX + (e.clientX - r.left) / r.width * BW, wy = camY + (e.clientY - r.top) / r.height * BH;
      // clicking an item or a person walks over and picks it up / starts talking
      const f = forage.find(o => Math.abs(o.x - wx) < 8 && wy > o.y - 15 && wy < o.y + 3);
      const npc = !f && npcs.find(c => Math.abs(c.x - wx) < 10 && wy > c.y - 38 && wy < c.y + 2);
      const goal = f || npc;
      hero.pending = goal ? (f ? { forage: f } : { npc }) : null;
      hero.target = goal ? { x: goal.x + (hero.x < goal.x ? -10 : 10), y: goal.y + 2 } : { x: wx, y: wy };
      sayEl.blur();
    });

    // ---------- loop ----------
    let last = 0;
    function frame(now) {
      const dt = last ? Math.min(50, now - last) : 16; last = now; tNow = now;
      gameMin += dt / 700;

      if (hero.target) { steer(hero); if (!move(hero, dt) && hero.moving) hero.target = null; if (!hero.target) hero.setInput({ left: false, right: false, up: false, down: false }); }
      else move(hero, dt);
      npcs.forEach(c => updateNpc(c, dt));
      updateBirds(dt);
      updateChickens(dt);
      if (hero.pending && !dialog) {
        const pd = hero.pending, o = pd.forage || pd.npc;
        if (Math.hypot(hero.x - o.x, hero.y - o.y) < (pd.forage ? 16 : 26)) {
          hero.pending = null; hero.target = null; hero.setInput({ left: false, right: false, up: false, down: false });
          if (pd.forage) { if (forage.includes(o)) pickUp(o); } else talk(o);
        } else if (!hero.target) hero.pending = null;
      }

      camX = Math.max(0, Math.min(WW - BW, Math.round(hero.x - BW / 2)));
      camY = Math.max(0, Math.min(WH - BH, Math.round(hero.y - BH / 2)));

      b.setTransform(K, 0, 0, K, -camX * K, -camY * K);
      b.drawImage(bg, 0, 0);
      drawWater(dt);
      [...props, ...forage.map(f => ({ y: f.y, draw: () => drawForage(f) })), ...birds.map(bd => ({ y: bd.y, draw: () => drawBird(bd) })),
        ...chickens.map(ch => ({ y: ch.y, draw: () => drawChicken(ch) })),
        ...chars.map(c => ({ y: c.y, draw: () => drawChar(c) }))].sort((p, q) => p.y - q.y).forEach(p => p.draw());
      drawButterflies(dt);
      drawSmoke(dt);
      drawNight(camX, camY);
      chars.forEach(c => drawEmote(c, dt));

      b.setTransform(K, 0, 0, K, 0, 0);
      drawHud();

      vctx.imageSmoothingEnabled = false;
      vctx.drawImage(buf, 0, 0);

      const underHud = (x, y) => x > 380 && y < 74;
      chars.forEach(c => { if (!underHud(c.x - camX, c.y - camY)) label(c.name, (c.x - camX) * K, (c.y - camY + 9) * K, c.isHero ? '#ffd23f' : '#fff3d6'); });
      if (!dialog) {
        const f = nearForage(), np = !f && nearNpc(), d = !f && !np && nearSpot();
        if (f) label('[Space] Pick up', (f.x - camX) * K, (f.y - camY - 18) * K, '#a8f070', 22);
        else if (np) label('[Space] Talk', (np.x - camX) * K, (np.y - camY - 46) * K, '#ffd27a', 22);
        else if (d) label('[Space] ' + d.name, (d.x - camX) * K, (d.y - camY - 44) * K, '#ffd27a', 24);
      }
      chars.forEach(c => drawBubble(c, now, camX, camY));

      uiText('Fri. 5', 444 * K, 16 * K, 26);
      uiText(clockText(), 444 * K, 45 * K, 24, 'center', '#b8323a');
      uiText('G  ' + String(gold).padStart(8, ' '), 470 * K, 64 * K, 24, 'right', '#ffe8a0');
      uiText('E', 467 * K, 140 * K, 22);
      drawFloaters(dt);
      drawNotices(dt);
      if (dialog) drawDialog(dt);
      requestAnimationFrame(frame);
    }

    function start() {
      // Downscale the sheet in two steps for a cleaner 2/5 result.
      const mid = document.createElement('canvas'); mid.width = img.width / 2; mid.height = img.height / 2;
      const m = mid.getContext('2d'); m.imageSmoothingQuality = 'high'; m.drawImage(img, 0, 0, mid.width, mid.height);
      sheet = document.createElement('canvas'); sheet.width = Math.round(img.width * S * K); sheet.height = Math.round(img.height * S * K);
      const s = sheet.getContext('2d'); s.imageSmoothingQuality = 'high'; s.drawImage(mid, 0, 0, sheet.width, sheet.height);
      // Snap alpha to fully on/off so outlines are hard edges instead of a soft halo.
      const px = s.getImageData(0, 0, sheet.width, sheet.height), d = px.data;
      for (let i = 3; i < d.length; i += 4) d[i] = d[i] > 110 ? 255 : 0;
      s.putImageData(px, 0, 0);
    }
    img.onload = start;

    const fontReady = document.fonts ? Promise.race([document.fonts.load('8px "Press Start 2P"'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
    fontReady.then(() => {
      drawBackground();
      buildProps();
      for (let i = 0; i < 120; i++) {
        const x = Math.random() * WW, y = Math.random() * WH;
        if (waterAt(x, y) && waterAt(x, y - 4) && y > 80) shimmer.push({ x, y, w: 2 + Math.floor(Math.random() * 4), p: Math.random() * 10 });
      }
      npcs = NPC_NAMES.map((n, i) => {
        const s = randomSpot(), c = makeChar(n, s.x, s.y, HATS[i]);
        c.wait = Math.random() * 3000; c.stuck = 0;
        return c;
      });
      chars = [hero, ...npcs];
      for (let i = 0; i < 12; i++) spawnForage();
      birds = Array.from({ length: 7 }, () => newBird(false));
      chickens = Array.from({ length: 5 }, newChicken);
      say(npcs[0], 'what a nice afternoon!');
      requestAnimationFrame(frame);
    });
  })();
  </script>
</body>
